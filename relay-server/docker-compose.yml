# mini-term 中转服务器:一条命令启动(在 relay-server/ 目录下执行)
#   docker compose up -d --build
# TLS 由前置反代(Caddy/Nginx)终结,见 docs/deploy-relay.zh-CN.md。
# 中转纪律:消息体不落盘——本服务不挂任何数据卷。
services:
  relay:
    build:
      context: ..
      dockerfile: relay-server/Dockerfile
    image: mini-term-relay
    container_name: mini-term-relay
    restart: unless-stopped
    ports:
      # 只绑本机回环,由反代对外提供 wss/https;如需直接暴露改成 "8080:8080"
      - "127.0.0.1:8080:8080"
    environment:
      RELAY_PORT: "8080"
      # RELAY_BIND: 0.0.0.0        # 容器内监听地址,默认即可
      # RELAY_PWA_DIR: /srv/pwa    # PWA 静态资源目录,镜像内已内置
