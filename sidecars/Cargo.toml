[package]
name = "mt-sidecars"
# 0.4.10:传输护栏从只拦 config.json 扩到整个数据目录(config.db / 备份 / WAL /
# credential.key 等,上传下载都拦);会话池的 known_hosts 校验认哈希条目、读失败即拒绝、
# 已登记其它算法时不再当新主机追加(旧 daemon 仍按旧规则放行)。
# 0.4.11:mt-ssh-cli 的 CLI / daemon / IPC 传输层 —— 冷启动拉起 daemon 不再泄漏调用方的
# 标准句柄(`$(…)` / `| tail` / WSL interop 不再等到 daemon 空闲自退)、daemon 工作目录改为
# exe 所在目录(不再锁住项目目录)、daemon 的 stderr 落数据目录下的 mt-ssh-cli-daemon.log;
# 版本握手只换代更旧的 daemon(更新且协议不同 → 降级 one-shot,不再与 dev 实例互踢),
# shutdown 改为停止接新连接、等在途请求(上限 60s)后再退出;IPC 客户端校验端点属于
# 当前用户(Windows 查管道服务端进程的 token SID,Unix 查 peer uid);WSL 里传
# `/tmp/x` 这类 POSIX 绝对路径不再错位成 `D:\tmp\x`。
# 同属 0.4.11 的 service 层:`--timeout` 覆盖整个请求(含建连 / 认证,连接阶段到点 exit 124
# 并说明命令没启动,取消令牌也能打断建连);exec 只在开 channel 时持会话锁(同连接并发、
# 不再全局串行),开 channel 10s 短超时 → 精确淘汰 session 后换新连接重试;exec 发出后立即
# 发 EOF;服务端拒绝 exec 立即报错,远端信号映射成 128+n 并在 stderr 说明;`--cwd` 按需加
# 引号(保留 `~/` 展开);审计脱敏补 --token / --api-key / --secret 等、sshpass、凭据类
# 环境变量与 Authorization 头,只记可能已执行的命令;传输护栏识别 `\\localhost\C$`、
# `\\?\`、WSL `\\wsl.localhost\…\mnt\c` 等别名并按装机版数据目录名纵深拦截;能力令牌报错
# 分类(配置不存在 / 读不了 / 令牌对不上 / 范围为空),fail closed 不变。
# 同属 0.4.11、经 mt-ssh / mt-secret 链进三个 sidecar 的改动:建连对齐终端里的系统 ssh(读
# `~/.ssh/config` 含 ProxyJump;认证依次试连接私钥 / ssh-agent / 默认私钥 / 密码,私钥读不了
# 就回落,公钥尝试有上限);池内建连整段 20s 上限(到点按连接错误 exit 2,报错写明卡在哪个
# 阶段);认证失败后同一连接冷却 30s;补 ecdh-nistp / aes128-gcm / hmac-sha1 兼容算法;
# known_hosts 认通配 / 否定 / @revoked。SFTP 传输只在开 channel 时持会话锁,下载约 1 MiB
# 窗口流水线,上传跟随软链、保留权限与属主(保不住时像 scp 一样原地覆盖写)、posix-rename
# 原子替换或备份 + 回滚。daemon 缓存的密钥在 credential.key 被主程序重建后解不开时重读。
version = "0.4.11"
description = "mini-term sidecar binaries: miniterm-hook (AI hook), mt-ssh-mcp (SSH MCP server) and mt-ssh-cli (SSH CLI + daemon)"
edition = "2021"

# 独立工作区：版本号自成语义 —— daemon 换代靠本 crate 版本判断，不跟随主程序
# 发版，故不并入根 workspace（并入还会触发依赖统一重排根 Cargo.lock）。
# sidecar 由 scripts/stage-sidecars.mjs 构建并就位到主程序 exe 同目录。
#
# 这个**空 `[workspace]` 表**是「独立」的自证，不能删：根 Cargo.toml 的
# `exclude = ["sidecars"]` 只在本目录恰好是那份 manifest 的直接下级时才管用。
# 在 git worktree（`.claude/worktrees/<name>/sidecars`）里 cargo 会一路向上找到
# **主仓**的根 Cargo.toml，那份 exclude 的相对路径对不上，于是报
# 「current package believes it's in a workspace when it's not」而拒绝构建。
# 有了这一行，无论 checkout 在哪都自成 workspace root。
[workspace]

# lib target：ssh_service 业务编排共享层，mt-ssh-mcp 与 mt-ssh-cli 两个 bin
# 都只做传输层、业务转调 lib（ssh-cli-skill spec §3）。
[lib]
name = "mt_sidecars"
path = "src/lib.rs"

[[bin]]
name = "miniterm-hook"
path = "src/bin/miniterm-hook.rs"

[[bin]]
name = "mt-ssh-mcp"
path = "src/bin/mt-ssh-mcp.rs"

[[bin]]
name = "mt-ssh-cli"
path = "src/bin/mt-ssh-cli.rs"

[dependencies]
mt-core = { path = "../crates/mt-core" }
# SSH 持久会话池 + SFTP 传输原语(russh 0.61 + ring 后端、ssh-key/rsa 精确锁、
# russh-sftp)。task 07-05-ssh-remote-projects PR1 抽到共享 crate mt-ssh,
# 主程序与 sidecar 共用;russh 类型(如 ChannelMsg)经 `mt_ssh::russh` 再导出取用,
# 保证与池同一 crate 版本。依赖版本锁的完整说明见 ../crates/mt-ssh/Cargo.toml。
mt-ssh = { path = "../crates/mt-ssh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# portable-pty 仅 miniterm-hook 仍在使用；mt-ssh-mcp 重构到 russh 后不再依赖。
portable-pty = "0.8"
# mt-ssh-mcp 的 MCP server 实现：官方 rmcp stdio server。
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
# mt-ssh-cli 的参数解析：clap derive（用法错误信息对 agent 可读性好，--help 即文档）。
clap = { version = "4", features = ["derive"] }
# CLI ↔ daemon IPC 帧的 stdout/stderr 分片编码（保二进制安全）。
base64 = "0.22"
# SFTP 传输的 tokio::fs 本地文件读写已随会话池迁入 mt-ssh(其 `fs`/`io-util`
# features 经 feature unification 依旧生效);这里只保留 sidecar 自身需要的面。
# `net` 供 mt-ssh-cli 的本机 IPC（Windows named pipe / Unix socket）。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "sync", "net"] }

# named pipe 安全描述符（仅当前用户可连）：SID 查询 + SDDL 转换。
# Win32_System_Pipes：客户端取管道服务端 PID 核验身份（GetNamedPipeServerProcessId）；
# Win32_System_Console：拉起 daemon 前取标准句柄、清掉可继承位（GetStdHandle）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# 发布构建。与根 Cargo.toml 同款三项，这里的体积收益更实在：
# miniterm-hook **每次 hook 事件都要冷启动一次**，二进制小一圈就是每次事件都省一点
# 加载与页面调入；三个 sidecar 还要随安装包平铺到 exe 同目录，体积直接进装机包。
#
# ⚠️ 同样**不加 `panic = "abort"`**：mt-ssh-cli 的 daemon 靠 unwind 把单个连接的
# panic 收敛成一次失败响应，abort 会让一条坏连接带走整个常驻 daemon。
[profile.release]
# thin LTO：跨 crate 内联收益的大头，链接时间可控。
lto = "thin"
# 单个 codegen unit：让 LLVM 看到整个 crate 再优化（sidecar 构建本身很快，不心疼）。
codegen-units = 1
# 剥符号表：三个 sidecar 都进装机包，能小则小。
strip = "symbols"

