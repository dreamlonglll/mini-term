[package]
name = "mt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "mini-term"
path = "src/main.rs"

[features]
# dev-only 度量工具:打开 gpui-pre 内置的帧剖析叠层(`src/frame_profiler.rs`)。
# **默认关**,发布构建一行代码、一个依赖都不带。
#
# 透传到 `gpui/profiler`(gpui-pre 0.3.5 `Cargo.toml:67` 的非默认 feature):
# 上游整套 `debug_overlay` 模块、`Window::set_debug_frame_overlay_mode`、
# `App::foreground_journal` 与 `WindowInvalidator` 里那两个计数字段全由它挂着,
# 不开就根本不编译;它唯一的新依赖是 `hdrhistogram`(上游拿它存帧耗时直方图)。
#
# ⚠️ feature 一开,gpui-pre 连同依赖它的 crate 会整棵重编(几分钟),且与默认
# 构建**不共用** target 缓存 —— 来回切换会反复重编,量化诊断时一次编完再用。
frame-profiler = ["gpui/profiler"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# `tree-sitter-languages` 是文件预览器(`file_viewer/`)语法高亮的唯一来源:
# 不开这个 feature 时 gpui-component 的 `Language` 枚举**只有 Json**
# (`src/highlighter/languages.rs:5-8`),.rs / .ts / .py 一律画成纯文本;开了得 30 种,
# 与原版 CodeMirror `@codemirror/language-data` 的覆盖面同量级。
# 代价是 30 个带 `cc` build script 的 tree-sitter 语言 crate 的首次编译时间 ——
# 一次性成本,换的是「内置编辑器与装机版观感一致」这条产品目标。
#
# **写在这里而不是根 `Cargo.toml`**:workspace 依赖允许成员 crate 在
# `workspace = true` 之上追加 feature(feature 是可加的),于是根文件保持不动。
gpui-component = { workspace = true, features = ["tree-sitter-languages"] }
# 组件库的图标资产源,挂在 `main.rs` 的 `application().with_assets(..)` 上。
# 不挂的话上游组件里所有 `Icon::new(IconName::..)` / `svg()` 都取不到字节 ——
# 画出来是**空白**,而且编译期毫无提示(这条前提此前拖着全仓十来处「只能自绘」的记档)。
# 与 gpui-component 同版本同源(见根 Cargo.toml 的说明),净新增 crate = 0。
gpui-kit-assets.workspace = true
# ---- 语法高亮补充语言包(`syntax_languages.rs`)----
# 组件库那 30 余种里 C# / Swift / CMake / Proto / GraphQL 只挂了解析器、高亮查询是空串,
# 打开 .cs 整篇纯文本色;PowerShell / XML / Dart 这些常见类型它根本没有
# (PHP / Lua 自 0.6 起组件库内置且带查询,不再由这里补;Kotlin 内置的查询是坏的,仍补)。
# 下面分两组:
#  1. 已在依赖树里的五个(gpui-component 拉进来的),这里只是为了拿解析器常量与
#     `HIGHLIGHTS_QUERY`,版本号与 Cargo.lock 里的一致,净新增 crate = 0;
#  2. 新增语法 crate,每个都是一份 `cc` 编译的 parser.c(与组件库那 30 个同一代价),
#     版本全钉在 tree-sitter-language 0.1 / ABI 14~15,与树里的 tree-sitter 0.25 相容。
#     **只收主流类型**(冷门语言不值这份体积);**禁止**引依赖老版 `tree-sitter = "0.2x"`
#     的语法 crate(dockerfile / fish / scss / vue / vim / json5 都是):会把第二份
#     tree-sitter 运行时链进来,C 符号重定义。
# 挑选口径见 syntax_languages.rs 模块注释;高亮查询 crate 没带的放 assets/syntax/。
tree-sitter-c-sharp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-cmake = "0.7"
tree-sitter-proto = "0.2"
tree-sitter-graphql = "0.1"
# kotlin:组件库 0.6 内置的那份查询编不过(见 syntax_languages.rs),仍由这里覆盖;
# 版本与组件库拉的同一个,净新增 crate = 0。
tree-sitter-kotlin-sg = "0.4"
tree-sitter-powershell = "0.26"
tree-sitter-xml = "0.7"
tree-sitter-dart = "0.2"
tree-sitter-groovy = "0.1"
tree-sitter-ini = "1.4"
tree-sitter-batch = "0.11"
# 语法 crate 导出的 `LANGUAGE` 是这个类型(`LanguageFn`),表里要写它的名字;
# 已在树里(每个语法 crate 都依赖它),零新增。
tree-sitter-language = "0.1"
# 远程 Markdown 与 gpui-component 使用同一份 GFM AST 解析器做 URL 清洗，
# 避免行级扫描漏掉跨行资源目标或误判代码围栏。该 crate 已由
# gpui-component 锁定在依赖树中，不会新增第三方包。
markdown = "1.0"
# Markdown 预览里 ```mermaid 围栏的图表渲染(issue #80),纯 Rust:Mermaid 文本 →
# SVG 字符串,不要浏览器 / Node。`default-features = false` 砍掉它自带的 CLI(clap)
# 与 PNG 输出(resvg 0.47 —— 与 gpui 锁定的 0.46 不同版本,开了就是第二份 resvg);
# 那份 SVG 的栅格化走 gpui 自带的 `SvgRenderer`(`file_viewer::mermaid::render_mermaid_image`),
# 本 crate 因此不直接依赖 resvg / usvg / tiny-skia,也不必再人肉对齐它们的 feature 集。
# 余下依赖(fontdb 0.23 / ttf-parser 0.25 / regex / serde / once_cell)全在树里,
# 净新增只有 json5(+ucd-trie)。
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# `image::Frame` / `RgbaImage` 只当 `gpui::RenderImage` 的字节容器
# (弹窗毛玻璃快照 frost.rs);版本跟随 gpui
# 已锁定的那份(0.25.x),不引第二份 image。
#
# `png` 是唯一开的编解码后端 —— 剪贴板图片(clipboard::win)要把 CF_DIB 的
# 裸像素编成 PNG 落盘。**只要编码器**,解码谁也不用(gpui 那条路拿到的本来
# 就是编好的字节,原样写盘)。
image = { version = "0.25", default-features = false, features = ["png"] }
mt-ui.workspace = true
mt-terminal.workspace = true
mt-pty.workspace = true
mt-config.workspace = true
# 界面布局(三栏比例 / 分屏树 / 窗口几何)的持久化。
mt-layout.workspace = true
mt-i18n.workspace = true
mt-project.workspace = true
mt-ai.workspace = true
mt-usage.workspace = true
mt-relay.workspace = true
# SSH 远程项目的服务层(audit #28:SFTP 文件操作 / 目录列举 / 远程会话 / 启动预检)。
# 原 `remote_ssh/` 模块下沉而来,自持一个小 tokio 运行时(见该 crate 的线程口径说明);
# russh 与 tokio 两层依赖随它走,mt-app 不再直接依赖 mt-ssh / tokio。
# SSH 工具 skill 启停(原 `ssh_registry.rs`)同期并进了 mt-ai,uuid / dirs / toml_edit
# 三条依赖随之离开本文件。
mt-remote.workspace = true
mt-core.workspace = true
# 已存 SSH 密码的封存/解封(`secrets.rs` 接线):表单保存时封存、编辑与自动填充时解开。
mt-secret.workspace = true
anyhow.workspace = true
# 活 pane 列表要在 GPUI 主线程与 mt-ai 的 500ms 轮询线程之间共享。
parking_lot.workspace = true
# PTY reader 线程 → 主线程的唤醒信号(gpui 的 AsyncApp 是 Rc,不能跨线程)。
# gpui 自己也依赖 futures 0.3,不会多拉一棵依赖树。版本收在工作区(与 mt-ssh 共用)。
futures.workspace = true
# 会话列表的相对时间、用量面板的本地日历日窗口。
chrono.workspace = true
# 页签标题跟随 shell(OSC 0/2)时按**字素**截断 —— 按 char 截会把 emoji 与
# 组合字拆到一半。工作区里已有这一行(mt-terminal 的列宽判定用同一份),
# 净新增 crate = 0。
unicode-segmentation.workspace = true
# 移动端配对二维码(工作区里已 default-features=false，只要位矩阵)。
# 渲染由 `mobile_relay::qr` 自绘 quad —— 不引 image 后端、不落临时文件。
qrcode.workspace = true
# 价格表响应的解析(`pricing::fetch_models_dev`)、布局/设置等处的 JSON 读写。
# 价格表缓存信封(model-pricing.json / .cache.json)的 serde 镜像已随归一 / 缓存
# 逻辑挪进 mt-usage(`models_dev`),本 crate 不再直接依赖 serde。
serde_json.workspace = true
# 用量分桶要 IANA 时区名:mt-usage 按每条记录自身时刻求当地偏移,
# 只给固定偏移的话 DST 地区的历史记录会错日。
iana-time-zone = "0.1"
# 价格表拉取(https://models.dev/api.json,一次 HTTPS GET)。
#
# **净新增 crate = 0**:`zed-reqwest` 已经在依赖树里(gpui → gpui_http_client),
# `blocking` feature 只额外要 futures-channel + tokio/sync,两者也都在树里。
# 不用 `cx.http_client()`:gpui 的默认实现是 `NullHttpClient`,`send()` 直接
# `bail!("No HttpClient available")`,而 `gpui_http_client` 只提供 trait、不带
# reqwest 后端(Zed 把那部分放在未发布的 reqwest_client crate 里)。
# blocking 客户端自己起 current-thread 运行时,mt-app 不必接 tokio;
# 调用一律丢 background executor(见 `pricing::fetch_models_dev` 的注释)。
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = [
    "blocking",
    "rustls-tls-native-roots",
    "charset",
    "http2",
] }

[dev-dependencies]
# 语言包单测要亲手 `Query::new` 把每份高亮查询编一遍:组件库那条路编不过只会
# `tracing::warn` 后静默退成纯文本,编译期与测试期都无感。已在树里,零新增。
tree-sitter = "0.26"
# 端到端验颜色要喂 `SyntaxHighlighter::update(&Rope)`;版本钉死跟组件库一致。
ropey = "=2.0.0-beta.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 的窗口后端不在 gpui 默认 feature 里(Windows / macOS 默认即可),
# 不开的话构建出来没有任何 windowing 实现。feature 是可加的,workspace
# 依赖之上追加不动根 manifest(与 gpui-component 的 tree-sitter 同一手法)。
gpui_platform = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# 本地 HTML 预览的系统 WebView(见 `file_viewer::webview` 模块注释)。
gpui-wry.workspace = true
wry.workspace = true

[target.'cfg(windows)'.dependencies]
# 任务栏闪烁(FlashWindowEx)、提示音(MessageBeep / PlaySoundW)与系统托盘。
# 版本跟随 gpui 已经在用的那个,不给依赖树引入第二份 windows crate
# (gpui-pre 0.3.5 用 0.62;此前这里停在 0.61,等于多编一整套 windows 0.61 家族。
# 依赖树里另有一份 0.58 是 gpui-component / gpui-base 带进来的,本仓对不齐)。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # 装机版日志落盘(logfile.rs):GetStdHandle 判「有没有 stderr」,
    # SetStdHandle 把 stderr / stdout 换成 mini-term.log 的句柄。
    "Win32_System_Console",
    # 首启探测界面语言:GetUserDefaultLocaleName。Windows 上 LANG/LC_ALL 这些
    # 环境变量通常不存在,只能问系统(见 i18n::system_locale)。
    "Win32_Globalization",
    # 托盘图标逐像素画:CreateDIBSection 造 32bpp 预乘 BGRA 位图,
    # 再由 CreateIconIndirect 变成 HICON(见 tray.rs)。
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    # MessageBeep 住在这个模块里(不是 WindowsAndMessaging)
    "Win32_System_Diagnostics_Debug",
    # 剪贴板图片(截图粘贴,见 clipboard::win):OpenClipboard / GetClipboardData /
    # IsClipboardFormatAvailable 住在 DataExchange,CF_DIB 句柄的
    # GlobalLock / GlobalSize 住在 Memory。gpui 自己的剪贴板只认
    # PNG/JFIF/GIF/SVG 四个**注册格式**,截图工具放的 CF_DIB 它一概读不到。
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # 托盘线程要注册自己的窗口类,RegisterClassW 的 hInstance 来自 GetModuleHandleW。
    "Win32_System_LibraryLoader",
    # Shell_NotifyIconW / NOTIFYICONDATAW —— 系统托盘图标的唯一入口。
    "Win32_UI_Shell",
    # 搜索结果单/双击判定:GetDoubleClickTime 读取系统双击间隔。
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # PrintWindow 住在打印/XPS 模块里(弹窗毛玻璃快照,见 frost.rs)。
    "Win32_Storage_Xps",
] }
# 从 gpui 的 Window 取 HWND。
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
# exe 图标与版本资源嵌入(见 build.rs)。build-dependencies 的 cfg 判的是
# **宿主**平台:mac/Linux 原生构建时这个 crate 根本不进依赖图。
winresource = "0.1"
