[package]
name = "mt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "mini-term"
path = "src/main.rs"

[features]
# dev-only 度量工具:打开 gpui-fast 内置的帧剖析叠层(`src/frame_profiler.rs`)。
# **默认关**,发布构建一行代码、一个依赖都不带。
#
# 透传到 `gpui/profiler`(gpui-fast 0.1.17 的非默认 feature):
# 上游整套 `debug_overlay` 模块、`Window::set_debug_frame_overlay_mode`、
# `App::foreground_journal` 与 `WindowInvalidator` 里那两个计数字段全由它挂着,
# 不开就根本不编译;它唯一的新依赖是 `hdrhistogram`(上游拿它存帧耗时直方图)。
#
# ⚠️ feature 一开,gpui-fast 连同依赖它的 crate 会整棵重编(几分钟),且与默认
# 构建**不共用** target 缓存 —— 来回切换会反复重编,量化诊断时一次编完再用。
frame-profiler = ["gpui/profiler"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# 组件库的逐语言 tree-sitter feature 是文件预览器(`file_viewer/`)语法高亮的内置来源:
# 一个都不开时 gpui-component 的 `Language` 枚举**只有 Json**
# (`src/highlighter/languages.rs:5-8`),.rs / .ts / .py 一律画成纯文本。
#
# **只开常用的这 22 种**(按需扩展阶段 C,替换原来的 `tree-sitter-languages` 总开关):
# 体积大的 cpp / elixir / php / ruby / scala / sql / zig 连同原 syntax_languages 补的
# C# / Swift / CMake / Proto / GraphQL / Kotlin / PowerShell / Dart / Groovy 挪进了语法包
# 动态库(`crates/mt-syntax-pack`,扩展 `syntax-pack` 按需下载,宿主侧见 `syntax_pack.rs`)。
# ⚠️ 别再开回 `tree-sitter-languages` 或上面那几种:开了就把挪走的语法又编回 exe,
# 而且语法包里的同名语言会覆盖它们,白白多一份体积。
#
# **写在这里而不是根 `Cargo.toml`**:workspace 依赖允许成员 crate 在
# `workspace = true` 之上追加 feature(feature 是可加的),于是根文件保持不动。
gpui-component = { workspace = true, features = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-ejs",
    "tree-sitter-erb",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-svelte",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
# 组件库的图标资产源,挂在 `main.rs` 的 `application().with_assets(..)` 上。
# 不挂的话上游组件里所有 `Icon::new(IconName::..)` / `svg()` 都取不到字节 ——
# 画出来是**空白**,而且编译期毫无提示(这条前提此前拖着全仓十来处「只能自绘」的记档)。
# 与 gpui-component 同版本同源(见根 Cargo.toml 的说明),净新增 crate = 0。
gpui-kit-assets.workspace = true
# 窗口级选区的 `TextSelection::end`(gpui-component 没重导出),用于兜住「按下到了、
# 抬起丢了」的选区卡死,见 `main.rs` 的 `text_selection_release_guard`。同版本同源,
# 净新增 crate = 0。
gpui-base.workspace = true
# ---- 语法高亮补充语言包(`syntax_languages.rs`)----
# 只剩三个小语法(XML / INI / 批处理,各几百 KB 内)内置;C# / Swift / CMake / Proto /
# GraphQL / Kotlin / PowerShell / Dart / Groovy 连同查询挪进了语法包(`crates/mt-syntax-pack`)。
# 每个语法 crate 都是一份 `cc` 编译的 parser.c,版本全钉在 tree-sitter-language 0.1 /
# ABI 14~15,与树里的 tree-sitter 相容。**禁止**引依赖老版 `tree-sitter = "0.2x"`
# 的语法 crate(dockerfile / fish / scss / vue / vim / json5 都是):会把第二份
# tree-sitter 运行时链进来,C 符号重定义。挑选口径见 syntax_languages.rs 模块注释。
tree-sitter-xml = "0.7"
tree-sitter-ini = "1.4"
tree-sitter-batch = "0.11"
# 语法 crate 导出的 `LANGUAGE` 是这个类型(`LanguageFn`),表里要写它的名字;语法包表里的
# 裸函数指针也经 `LanguageFn::from_raw` 包回去。已在树里,零新增。
tree-sitter-language = "0.1"
# 语法包加载器(`syntax_pack.rs`)要核 `Language::abi_version()` 落在
# `MIN_COMPATIBLE_LANGUAGE_VERSION..=LANGUAGE_VERSION` 里,得能叫出这个 crate 的名字。
# 与组件库用的同一份(已在树里),零新增。
tree-sitter = "0.26"
# 语法包的表结构 / 版本 / 语言清单(零依赖)。
mt-syntax-pack-abi = { path = "../mt-syntax-pack-abi" }
# 加载语法包动态库。Cargo.lock 里已有(0.8.9,gpui 的图形栈带进来),零新增。
libloading = "0.8"
# 远程 Markdown 与 gpui-component 使用同一份 GFM AST 解析器做 URL 清洗，
# 避免行级扫描漏掉跨行资源目标或误判代码围栏。该 crate 已由
# gpui-component 锁定在依赖树中，不会新增第三方包。
markdown = "1.0"
# Markdown 预览里 ```mermaid 围栏的图表渲染(issue #80),纯 Rust:Mermaid 文本 →
# SVG 字符串,不要浏览器 / Node。`default-features = false` 砍掉它自带的 CLI(clap)
# 与 PNG 输出(resvg 0.47 —— 与 gpui 锁定的 0.46 不同版本,开了就是第二份 resvg);
# 那份 SVG 的栅格化走 gpui 自带的 `SvgRenderer`(`file_viewer::mermaid::render_mermaid_image`),
# 本 crate 因此不直接依赖 resvg / usvg / tiny-skia,也不必再人肉对齐它们的 feature 集。
# 余下依赖(fontdb 0.23 / ttf-parser 0.25 / regex / serde / once_cell)全在树里,
# 净新增只有 json5(+ucd-trie)。
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# `image::Frame` / `RgbaImage` 只当 `gpui::RenderImage` 的字节容器
# (弹窗毛玻璃快照 frost.rs);版本跟随 gpui
# 已锁定的那份(0.25.x),不引第二份 image。
#
# `png` 是唯一开的编解码后端 —— 剪贴板图片(clipboard::win)要把 CF_DIB 的
# 裸像素编成 PNG 落盘。**只要编码器**,解码谁也不用(gpui 那条路拿到的本来
# 就是编好的字节,原样写盘)。
image = { version = "0.25", default-features = false, features = ["png"] }
mt-ui.workspace = true
mt-app-core.workspace = true
mt-terminal.workspace = true
mt-pty.workspace = true
mt-config.workspace = true
# 界面布局(三栏比例 / 分屏树 / 窗口几何)的持久化。
mt-layout.workspace = true
mt-i18n.workspace = true
# 按需扩展的本机侧(清单 / 查找 / 校验安装 / GC / 离线导入);下载那一跳在 `extensions.rs`。
mt-extensions.workspace = true
mt-project.workspace = true
mt-ai.workspace = true
mt-usage.workspace = true
mt-relay.workspace = true
# SSH 远程项目的服务层(audit #28:SFTP 文件操作 / 目录列举 / 远程会话 / 启动预检)。
# 原 `remote_ssh/` 模块下沉而来,自持一个小 tokio 运行时(见该 crate 的线程口径说明);
# russh 与 tokio 两层依赖随它走,mt-app 不再直接依赖 mt-ssh / tokio。
# SSH 工具 skill 启停(原 `ssh_registry.rs`)同期并进了 mt-ai,uuid / dirs / toml_edit
# 三条依赖随之离开本文件。
mt-remote.workspace = true
mt-core.workspace = true
# 已存 SSH 密码的封存/解封(`secrets.rs` 接线):表单保存时封存、编辑与自动填充时解开。
mt-secret.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 活 pane 列表要在 GPUI 主线程与 mt-ai 的 500ms 轮询线程之间共享。
parking_lot.workspace = true
# PTY reader 线程 → 主线程的唤醒信号(gpui 的 AsyncApp 是 Rc,不能跨线程)。
# gpui 自己也依赖 futures 0.3,不会多拉一棵依赖树。版本收在工作区(与 mt-ssh 共用)。
futures.workspace = true
# 会话列表的相对时间、用量面板的本地日历日窗口。
chrono.workspace = true
# 页签标题跟随 shell(OSC 0/2)时按**字素**截断 —— 按 char 截会把 emoji 与
# 组合字拆到一半。工作区里已有这一行(mt-terminal 的列宽判定用同一份),
# 净新增 crate = 0。
unicode-segmentation.workspace = true
# 移动端配对二维码(工作区里已 default-features=false，只要位矩阵)。
# 渲染由 `mobile_relay::qr` 自绘 quad —— 不引 image 后端、不落临时文件。
qrcode.workspace = true
# SSH / 凭据等随机令牌生成(`store::prefs`)，与 mt-app-core / mt-secret 共用同一份 ring 0.17。
ring = "0.17"
# 价格表响应的解析(`pricing::fetch_models_dev`)、布局/设置等处的 JSON 读写。
# 价格表缓存信封(model-pricing.json / .cache.json)的 serde 镜像已随归一 / 缓存
# 逻辑挪进 mt-usage(`models_dev`),本 crate 不再直接依赖 serde。
serde_json.workspace = true
# 文件树本地删除进系统回收站(`file_tree::recycle`)。版本与取舍见根 Cargo.toml 那一行;
# 不放 mt-project 的理由同那里(mt-git-helper 是服务器端程序)。
trash.workspace = true
# 用量分桶要 IANA 时区名:mt-usage 按每条记录自身时刻求当地偏移,
# 只给固定偏移的话 DST 地区的历史记录会错日。
iana-time-zone = "0.1"
# 价格表 / 预览外链图 / 更新检查 / 远程通知共用的异步 HTTP 客户端(`src/http.rs`)。
#
# **净新增 crate = 0**:`zed-reqwest` 已经在依赖树里(gpui → gpui_http_client)。
# 不用 `cx.http_client()`:gpui 的默认实现是 `NullHttpClient`,`send()` 直接
# `bail!("No HttpClient available")`,而 `gpui_http_client` 只提供 trait、不带
# reqwest 后端(Zed 把那部分放在未发布的 reqwest_client crate 里)。
# 不再开启 `blocking` feature(省掉其自带的额外同步运行时线程):异步 `reqwest::Client`
# 经 `mt_remote::run_on_shared_runtime` 复跑在共享的 `mt-async-io` tokio 运行时上,
# mt-app 仍不直接依赖 tokio,且弱网请求不再占满 GPUI 后台线程池。
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = [
    "rustls-tls-native-roots",
    "charset",
    "http2",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# 语法包单测(`syntax_pack.rs`)不经动态库,直接链接语法包的 rlib、走同一张表注册,
# 端到端验 C# / Kotlin / CMake 上色与改写后的查询能编译。只进测试,不进 exe。
mt-syntax-pack = { path = "../mt-syntax-pack" }
# 端到端验颜色要喂 `SyntaxHighlighter::update(&Rope)`;版本钉死跟组件库一致。
ropey = "=2.0.0-beta.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 的窗口后端不在 gpui 默认 feature 里(Windows / macOS 默认即可),
# 不开的话构建出来没有任何 windowing 实现。feature 是可加的,workspace
# 依赖之上追加不动根 manifest(与 gpui-component 的 tree-sitter 同一手法)。
gpui_platform = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# 本地 HTML 预览与 PDF 页签的系统 WebView(见 `file_viewer::webview` 模块注释)。
gpui-kit.workspace = true
gpui-webview.workspace = true
wry.workspace = true

[target.'cfg(windows)'.dependencies]
# 任务栏闪烁(FlashWindowEx)、提示音(MessageBeep / PlaySoundW)与系统托盘。
# 版本跟随 gpui 已经在用的那个,不给依赖树引入第二份 windows crate
# (gpui-fast 0.1.17 用 0.62;此前这里停在 0.61,等于多编一整套 windows 0.61 家族。
# 依赖树里另有一份 0.58 是 gpui-component / gpui-base 带进来的,本仓对不齐)。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # 装机版日志落盘(logfile.rs):GetStdHandle 判「有没有 stderr」,
    # SetStdHandle 把 stderr / stdout 换成 mini-term.log 的句柄。
    "Win32_System_Console",
    # 首启探测界面语言:GetUserDefaultLocaleName。Windows 上 LANG/LC_ALL 这些
    # 环境变量通常不存在,只能问系统(见 i18n::system_locale)。
    "Win32_Globalization",
    # 托盘图标逐像素画:CreateDIBSection 造 32bpp 预乘 BGRA 位图,
    # 再由 CreateIconIndirect 变成 HICON(见 tray.rs)。
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    # MessageBeep 住在这个模块里(不是 WindowsAndMessaging)
    "Win32_System_Diagnostics_Debug",
    # 右键 SSH 连接存活探测(ssh_process.rs):CreateToolhelp32Snapshot / Process32FirstW /
    # Process32NextW 扫描 PTY 根进程下的 ssh.exe 子进程。
    "Win32_System_Diagnostics_ToolHelp",
    # 剪贴板图片(截图粘贴,见 clipboard::win):OpenClipboard / GetClipboardData /
    # IsClipboardFormatAvailable 住在 DataExchange,CF_DIB 句柄的
    # GlobalLock / GlobalSize 住在 Memory。gpui 自己的剪贴板只认
    # PNG/JFIF/GIF/SVG 四个**注册格式**,截图工具放的 CF_DIB 它一概读不到。
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # 托盘线程要注册自己的窗口类,RegisterClassW 的 hInstance 来自 GetModuleHandleW。
    "Win32_System_LibraryLoader",
    # Shell_NotifyIconW / NOTIFYICONDATAW —— 系统托盘图标的唯一入口;
    # SetWindowSubclass 拦 WebView 转来的键盘菜单(见 native_view.rs)。
    "Win32_UI_Shell",
    # 搜索结果单/双击判定:GetDoubleClickTime 读取系统双击间隔。
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # PrintWindow 住在打印/XPS 模块里(弹窗毛玻璃快照,见 frost.rs)。
    "Win32_Storage_Xps",
    # GetDriveTypeW:本地删除前判这个盘有没有回收站(见 file_tree::recycle)。
    # gpui 的 windows 0.62 已经开着这一项,不多编东西。
    "Win32_Storage_FileSystem",
] }
# 从 gpui 的 Window 取 HWND。
raw-window-handle = "0.6"
# PDF 页签藏掉 Edge 阅读器的保存按钮要直接调 WebView2 的 COM 接口
# (ICoreWebView2Settings7,见 file_viewer::webview)。两个都是 wry 已经带进依赖树的
# 那一份,不新增编译量;windows-core 钉 0.61 是因为 webview2-com 的接口挂在它上面
# (`cast` 要它的 Interface trait),与上面 0.62 那份不通用。
webview2-com = "0.38"
webview2-windows-core = { package = "windows-core", version = "0.61" }

[target.'cfg(windows)'.build-dependencies]
# exe 图标与版本资源嵌入(见 build.rs)。build-dependencies 的 cfg 判的是
# **宿主**平台:mac/Linux 原生构建时这个 crate 根本不进依赖图。
winresource = "0.1"
