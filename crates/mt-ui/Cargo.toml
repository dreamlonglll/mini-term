[package]
name = "mt-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
mt-terminal.workspace = true
# TerminalElement 直接读 alacritty 的 Cell / Flags / Color / Selection。
# 与 mt-terminal 取同一个 workspace 版本,类型才互通。
alacritty_terminal.workspace = true
# 主题桥:读 themes/ 下的主题包(ThemePacks)并把配色映射成 TerminalTheme /
# gpui-component 的 ThemeConfig。文件层不依赖 gpui,映射代码只能住在这边。
#
# ⚠️ 只依赖拆出来的 mt-theme-packs,**不要**再依赖 mt-config / mt-i18n / mt-project:
# 前两个改得勤(config.rs、生成的 dict.rs),每改一次都会把本 crate 两万多行整个重编;
# mt-project 带 git2 等重库。查找条文案由宿主注入(`TerminalSearchBar::new` 的
# labels 参数),技术栈徽标按落盘字符串查表(`TechIcon::new(kind.as_str())`)。
mt-theme-packs.workspace = true
# 粘贴的 bracketed paste 编码(`mt_core::paste`,与 mt-relay 的移动端指令共用一份)。
# 叶子 crate(只依赖 serde / serde_json / dirs),不带重库,也很少改。
mt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# 只当 `gpui::RenderImage` 的字节容器(`image::Frame` / `RgbaImage`,终端里的图片用),
# 不解码任何东西。与 gpui、mt-terminal 同一份 0.25。
image = { version = "0.25", default-features = false }

[dev-dependencies]
# 单测现场编一张 PNG、走一遍真的传输。
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
