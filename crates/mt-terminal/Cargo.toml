[package]
name = "mt-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
alacritty_terminal.workspace = true
parking_lot.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
# Kitty 图形协议(`kitty` 模块):PNG 解码与缩放、payload 的 base64、流式预解析里找 ESC。
# 都是依赖树里已有的那一份:image 与 mt-app 同取 0.25(只开 png),base64 与 mt-secret
# 同取 0.22,memchr 是 vte 自己也在用的。
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
memchr = "2"

[dev-dependencies]
# 只给 `tests/terminal_smoke.rs` 用:起真 PTY 把字节喂进状态机,验 PTY → VT → grid
# 这半截链路。库本身不依赖 mt-pty(字节从哪来由调用方决定)。
#
# 这份冒烟测试原先挂在 mt-app 下 —— 一个包只要带 `tests/`,`cargo test` 就得先把
# 它的 bin 编出来,于是 `cargo test -p mt-app` 要替换 `target/debug/mini-term.exe`,
# 与运行中的 dev 实例抢文件锁。挪到这里后 mt-app 不再有集成测试。
mt-pty.workspace = true
