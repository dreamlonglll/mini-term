[package]
name = "mt-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

# SSH 远程项目的服务层(SFTP 文件操作 / 目录列举 / 远程会话扫描 / 启动预检),
# 自 mt-app 的 `remote_ssh/` 模块整块下沉而来。**不依赖 gpui**:入口全是同步阻塞
# 函数,由 mt-app 丢进 background executor 调用(线程口径见 lib.rs 模块注释)。

[dependencies]
# russh 持久会话池 + SFTP 只读/上传原语(audit #28)。
mt-ssh.workspace = true
# `SshConnection`(mt-core 定义、mt-config 再导出)与下载目录校验
# `AppConfig::validate_download_dir`。
mt-config.workspace = true
mt-core.workspace = true
# 远程文件树与本地树同构:`FileEntry` / `TextGitignore` / 自然排序 / 本地分流。
mt-project.workspace = true
# 远程会话扫描复用本地那套解析与全局会话缓存。
mt-ai.workspace = true
# 远程 pane 的 ssh 客户端探测与 argv 拼装(`mt_pty::ssh`)。
mt-pty.workspace = true
# autofill 前解开已存密码的信封(`prepare_remote_launch`)。直连底层而不是回调
# mt-app:mt-secret 只在 mt-core 之上,不会成环,凭据库又是进程级单例。
mt-secret.workspace = true
serde_json.workspace = true
# 本 crate 自持的 tokio 边界:russh / russh-sftp 的 IO 要 tokio driver,
# gpui 的执行器喂不动。工作区里已有这一行(mt-relay 用同一份 feature 集)。
#
# ⚠️ 追加 `net`:`Builder::enable_all()` 只在 tokio 开了 `net` 时才顺带
# `enable_io()`,否则 IO 驱动缺席、russh 建 TcpStream 时 panic
# 「there is no reactor running」。目前 `net` 靠 russh 的特性统一带进来,
# 但那是**别人的**依赖声明 —— 显式写出来,免得哪天依赖树一变就静默失灵。
tokio = { workspace = true, features = ["net"] }

# 本 crate 没有 unsafe,也不该有:要碰系统调用就放进已经带 unsafe 的封装层
# (mt-pty / mt-secret / mt-project / mt-app),这里只调它们的安全接口。
[lints.rust]
unsafe_code = "forbid"
