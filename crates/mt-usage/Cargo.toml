[package]
name = "mt-usage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
chrono.workspace = true
# 分桶按记录自身时刻求当地偏移(DST 地区历史记录不错日),chrono-tz 带 IANA 数据
chrono-tz = "0.10"
# 版本与 features 收在工作区(三家 db 必须同版本,理由见根 Cargo.toml)；
# bundled 拉 libsqlite3-sys 0.38，其 build.rs 用 cfg_select!
# ——工作区 rust-version = 1.95 的底线就是为它定的
rusqlite.workspace = true
# 读 ~/.codex/config.toml 的 model_providers.<id>.base_url(供应商归属)
toml_edit = "0.22"
# 会话文件枚举/元信息行解析/grok_home 直连 mt-ai(ai_shim 临时副本已删)
mt-ai.workspace = true
# 路径比较键(项目 scope 的 cwd 匹配,`path_key::windows_eq_key`)
mt-core.workspace = true

# 本 crate 没有 unsafe,也不该有:要碰系统调用就放进已经带 unsafe 的封装层
# (mt-pty / mt-secret / mt-project / mt-app),这里只调它们的安全接口。
[lints.rust]
unsafe_code = "forbid"
