[package]
name = "mt-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
regex.workspace = true
dirs.workspace = true
# 收尾-1 批去重:atomic_write / parse_wsl_unc / strip_ansi_codes 三个纯函数
# 原本在 crate::util、crate::detect 里各存一份逐字副本(mt-core 当时还在
# `src-tauri/` 下,反向依赖会把整套 Tauri 依赖拖进来)。mt-core 移入 `crates/`
# 后副本已删,统一走它。mt-core 是叶子(serde/serde_json/dirs),不带包袱。
mt-core.workspace = true
# 编排者派活时追加的那段汇报格式要求(ADR 0004 / 工单 10)是**会被写进另一个
# AI 会话终端的用户可见文案**,得随界面语言走 —— 硬编码在 Rust 里就只剩一种
# 语言,而这一句是要对面那个 LLM 照着执行的指令,语言不对它就照着回错格式。
#
# 引它不给本 crate 添包袱:mt-i18n 是**零第三方依赖的叶子**(字典是编译期
# 静态表,唯一且可选的依赖 serde 本 crate 早就在用),并且明令**绝不引 gpui**
# —— 后端 crate 取文案不该被拖进 GPU 栈。语言由 mt-app 在启动与切语言时
# `set_locale` 定,本 crate 只 `t()` 读那个全局,不自己传 locale。
mt-i18n.workspace = true
# hook 上报接收端。三家 CLI 里已注册的 hook 命令 POST 到 127.0.0.1:23456/hook,
# 端口/协议/路由都是用户机器上的既成事实,不能改(版本照抄 src-tauri/Cargo.toml)。
tiny_http = "0.12"
# Codex 的 ~/.codex/config.toml 要开 features.codex_hooks,改 TOML 得保留用户
# 自己的注释与排版,故用 toml_edit 而非 toml。
toml_edit = "0.22"
# 编排令牌的随机源(control.rs):v4 UUID 走 getrandom = 操作系统 CSPRNG。
# 本 crate 原本没有随机数依赖,而 uuid 已在工作区里(mt-relay / mt-app 都用),
# 不多拉一棵树。
uuid.workspace = true
# AI 感知的那批状态表横跨三条线程(GPUI 主线程 / 500ms 轮询 / hook HTTP)。
# std::sync::Mutex 的锁中毒会把任一线程的 panic 传染成全进程崩溃,故统一
# 换 parking_lot(mt-app/mt-pty/mt-terminal 已是同款)。
parking_lot.workspace = true

[dev-dependencies]
# 跨工作区对账:编排控制面的**桌面侧 handler 产出**要能被 sidecar CLI 自己的
# 解析器读懂(`tests/orchestrator_wire.rs`)。两侧隔着工作区边界、各有一份类型,
# 只靠字段名对齐 —— 与 `mt-config` 的「投影能被 sidecar 的解析器读懂」同一种缝。
#
# 引的是 `sidecars/agent-control`(serde 两件套之外无依赖)而不是 sidecars 根包:
# 后者挂着 russh / rmcp / tokio 一串,拉进 `cargo test -p mt-ai` 就是白等编译。
mt-agent-control = { path = "../../sidecars/agent-control" }
