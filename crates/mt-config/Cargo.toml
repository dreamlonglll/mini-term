[package]
name = "mt-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dirs.workspace = true
# 收尾-1 批去重:`SshConnection` 定义与 `atomic_write` 实现收归叶子 crate mt-core,
# 本 crate 改为再导出/引用。方向选 mt-config → mt-core 的论证见
# config.rs 中 `SshConnection` 的文档注释(反向会把 zip/sha2 拖进 sidecar 小二进制)。
mt-core.workspace = true
# 已存 SSH 密码的封存:加载时把存量明文一次性换成信封并落库,保存时兜底封存,
# 密钥文件 `credential.key` 与 config.db 同目录(见 config.rs 的「密码封存」一节)。
mt-secret.workspace = true
# 主题包导入:zip 解包 + manifest.json 的 sha256 校验。版本收在工作区(与 mt-relay 共用)。
sha2.workspace = true
zip = "8.6.0"
# `config.db`:AppConfig 的持久化归属方(见 src/db.rs 的模块注释)。
#
# 版本(与 mt-usage / mt-layout 对齐的那条约束)在工作区统一声明,这里只**追加**
# 本 crate 独需的 `backup` feature —— features 是可加的,工作区给的 `bundled` 仍在。
# `backup` 供每启动一代的库备份:WAL 模式下直接 copy 主库文件会漏掉还没
# checkpoint 的那部分。
rusqlite = { workspace = true, features = ["backup"] }
