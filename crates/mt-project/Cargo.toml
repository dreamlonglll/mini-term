[package]
name = "mt-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
# 技术栈探测解析 `package.json` 的依赖表(`project_kind::parse_package_deps`,
# 随探测逻辑自 mt-app 移入)。工作区里已有,零新增。
serde_json.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
regex.workspace = true
# 收尾-1 批去重:`fs::atomic_write` 的实现收归叶子 crate mt-core,
# 本 crate 改为再导出(公开路径 `mt_project::fs::atomic_write` 不变)。
mt-core.workspace = true
# 以下四个工作区里没有,版本与 feature 照抄 src-tauri/Cargo.toml。
# git2 必须保留 vendored-openssl:Windows MSVC 上不 vendored 会去找系统 OpenSSL,
# 依据见 spec/backend/rust-crypto-on-windows-msvc.md。
git2 = { version = "0.19", features = ["vendored-openssl"] }
notify = "7"
ignore = "0.4"
pathdiff = "0.2"
# 非 UTF-8 文本的编解码(`encoding` 模块:GBK / Shift_JIS / UTF-16 …)。依赖树里本来就有
# 这一份(gpui 栈带进来的),版本对齐 Cargo.lock,只是提成直接依赖。
encoding_rs = "0.8.41"
# 猜编码(Firefox 同款检测器),取舍见 `encoding` 模块注释。
chardetng = "0.1"

[target.'cfg(windows)'.dependencies]
# WSL 发行版枚举:读 HKCU\...\Lxss 注册表,不 spawn wsl.exe(避免 UTF-16 stdout 坑)。
# 版本跟 gpui-pre-windows 已经在用的那份对齐(此前是 0.2,依赖树里同时编
# 0.2 / 0.4 / 0.6 三份;0.4 是 zed-reqwest 带进来的,对不齐)。
windows-registry = "0.6"
# git CLI 超时要连孙进程一起杀(`git.exe` 只是启动器,hook / ssh 都是它的后代):
# spawn 后挂进 Job Object,超时 `TerminateJobObject`。版本与 mt-secret 那份对齐
# (根 Cargo.toml 的 workspace.dependencies 里没有它,mt-secret 也是直接写版本)。
# `Win32_System_Threading`:等 git 退出用 `WaitForSingleObject`(退出即醒,不轮询)。
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
