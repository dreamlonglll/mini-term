# mini-term 主工作区(GPUI 原生应用)
#
# 这个工作区只包含 `crates/`。其余目录各自独立构建:
#   - `sidecars/`:sidecar 二进制工作区(miniterm-hook / mt-ssh-mcp / mt-ssh-cli)。
#     版本号自成语义(daemon 换代靠它判断,不跟随主程序发版),且并入会触发依赖
#     统一重排本工作区的 Cargo.lock,故保持独立。由 scripts/stage-sidecars.mjs
#     构建并就位到主程序 exe 同目录。
#   - `relay-server/`:移动端中转服务(其 protocol crate 被 mt-relay path 依赖,
#     与 sidecars 依赖 crates/mt-core 是同一种跨工作区用法)。
#   - `mobile/`:移动端 PWA(纯前端,无 Rust)。
#
# 历史:旧 Tauri 版(`src-tauri/` + React 前端 `src/`)已随 v1.0.0-beta 后的
# 发版切换整体删除,GPUI 版是唯一形态;找旧实现看 git 历史。
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["sidecars", "relay-server", "mobile", "patches"]

[workspace.package]
version = "1.14.8-pre"
edition = "2024"
# 与 src-tauri 保持同一底线(libsqlite3-sys 0.38 的 build.rs 用 cfg_select!)
rust-version = "1.95"
authors = ["mini-term"]
license = "MIT"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# GPUI 栈
# ---------------------------------------------------------------------------
# 全部取自 crates.io，不用 git 依赖 —— 可复现、可锁版本。
#
# ⚠️ 不要换成 `gpui-ce`:gpui-component 0.10(开启 `gpui-fast` feature)依赖的是
#    `gpui-fast`(与本仓 `gpui` 别名指向同一个包;上游残留在 Cargo.toml 里的
#    `gpui-pre` 由文末 `[patch.crates-io]` 空壳 stub 拦截),混用会在依赖树里出现
#    两个不同的 gpui crate,类型无法互通。
#    (gpui-ce 的卖点是 wgpu 单一后端，代价是没有任何组件库可用，且
#     crates.io 版本停在 0.3.3 / 2025-12-27。)
#
# ⚠️ Linux 构建需要额外打开 gpui_platform 的 `x11` / `wayland` feature
#    (见 mt-app 的 target 依赖段)。
# ⚠️ `font-kit` 不能删:gpui_platform 的 default 是空的,不开它 gpui_macos 就退到
#    `NoopTextSystem` —— macOS 上排版照给字宽、一个字形都不画,界面只剩图标与边框
#    (issue #82,v1.13.6-pre ~ v1.13.11-pre 的 mac 包全中)。gpui 自己 default 里那个
#    `font-kit` 管不到 gpui_macos。Windows(DirectWrite)/ Linux 不受影响。
#    守门:`tests/gpuiMacFontKit.test.cjs`。
# spike/gpui-fast: 底座切到 Longbridge 的 gpui-fast 0.1.17 + gpui-component/gpui-kit 0.10.0。
# 0.3.x / gpui-fast 把窗口/文字后端拆去了 gpui_platform,应用入口仍是 gpui_platform::application()。
gpui = { package = "gpui-fast", version = "0.1.17" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.17", features = ["font-kit"] }
# 组件库:Resizable(替 Allotment) / Tree(替 FileTree) / TabBar / Modal / Input /
# Table，以及 JSON 驱动的主题层 + 运行时主题注册表(替自研 theme_packs 的一部分)。
gpui-component = { version = "0.10.0", features = ["gpui-fast"] }
# 组件库的图标资产(`AssetSource`)。版本与 gpui-component 完全一致。
gpui-kit-assets = { version = "0.10.0", features = ["gpui-fast"] }
# 组件库的底层原语包(`TextSelection`)。版本与 gpui-component 完全一致。
gpui-base = { version = "0.10.0", features = ["gpui-fast"] }
# gpui-webview 0.10 通过 gpui-kit 选择后端;这里只开 gpui-fast 开关(不拉默认组件/资产重复声明)
# 以满足 gpui-webview 的编译期后端一致断言。
gpui-kit = { version = "0.10.0", default-features = false, features = ["gpui-fast"] }
# 本地 HTML 预览与 PDF 页签的系统 WebView(Windows = WebView2,macOS = WKWebView)。
# 原 gpui-wry 自 0.7 起改名为 gpui-webview,启用 gpui-fast 与主栈保持一致。
gpui-webview = { version = "0.10.0", features = ["gpui-fast"] }
# gpui-webview 用的 wry 分支(longbridge 维护)。建 WebView 要直接用它的 builder,
# 版本与 gpui-webview 拉的那份一致,依赖树里只有一份。
wry = { package = "lb-wry", version = "0.53.3" }

# ---------------------------------------------------------------------------
# 终端
# ---------------------------------------------------------------------------
# VT 状态机。取代 xterm.js:字节直接喂进 Term 的 grid，没有 IPC、没有 JSON、
# 没有 Base64、没有前端解析 pass —— 现有的 16ms 批缓冲 / 有界 channel /
# 4MB-1MB 双水位背压 / set_pty_flow_paused / 30s 超时兜底整套随之作废。
alacritty_terminal = "0.26"
portable-pty = "0.8"
# 列宽判定。alacritty_terminal 自己就靠它(逐字符定宽),mt-terminal 用同一份表算
# emoji 字位簇的**整簇**宽度(`mt-terminal::width`),版本跟它对齐。
unicode-width = "0.2"
# 字位簇边界(UAX #29):emoji 呈现 / 修饰 / ZWJ 序列、区域指示符成对这些「几个字符
# 落一格」的判定靠它。gpui 依赖树里本来就有,不多拉一棵。
unicode-segmentation = "1"

# ---------------------------------------------------------------------------
# 通用
# ---------------------------------------------------------------------------
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
parking_lot = "0.12"
dirs = "6"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# 文件树本地删除进系统回收站(mt-app `file_tree::recycle`)。Windows 上用的 `windows` 0.62
# 与 gpui 同一份,不引第二套 windows 家族。⚠️ 只给 mt-app 用,**不要**加进 mt-project:
# 后者被服务器端的 `mt-git-helper`(Linux musl 静态构建)链接,不能拖进桌面依赖。
# 默认 feature 不砍:其中的时间库只在 Linux 上编,给 .trashinfo 写 `DeletionDate`(freedesktop
# 回收站规范里是必填项);Windows 上是 COM 单线程套间(调用方在一条新线程上调,见
# `file_tree::recycle` 模块注释)。
# ⚠️ 钉死 =5.3.0:5.4.0 与它的唯一差别是把这个时间库从 chrono(树里已有)换成了刚发布的
# jiff 1.x(连带 jiff-core 1.x 两个新 crate),Windows / macOS 两支的代码一字未改。
trash = "=5.3.0"
# 移动端配对二维码(U 批)。default-features=false 砍掉 image 输出后端 ——
# 只要 QrCode 的位矩阵，渲染由 mt-app 自绘(静区 1 模块 / EC level M)。
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
# 跨线程 join_all / oneshot 等组合子(mt-app 的 PTY 唤醒信号、mt-ssh 的池 shutdown)。
# gpui 自己就依赖 futures 0.3,提到工作区只是去重声明,不会多拉一棵依赖树。
futures = "0.3"
# 主题包 manifest 的 sha256 校验(mt-theme-packs)。
sha2 = "0.11.0"
# 跨多个工作区 crate 共用的基础编码与 TOML 编辑库(mt-secret / mt-ssh / sidecars
# 因被独立工作区 path 依赖仍保持显式版本号,与之对齐)。
base64 = "0.22"
toml_edit = "0.22"
# 结构化日志门面与订阅器(已在 gpui / tokio 依赖树里锁死同版本,净新增 crate = 0)。
tracing = "0.1"
tracing-subscriber = "0.3"
# SQLite:config.db(mt-config)/ layout.db(mt-layout)/ usage.db(mt-usage) 三家共用。
#
# ⚠️ **版本必须三家一致**:同一棵依赖树里出现两个 rusqlite 会连带两份
# libsqlite3-sys,构建直接失败 —— 提到工作区正是为了让这条约束由 Cargo 兜住,
# 而不是靠三份注释互相提醒。
#
# features 只放三家的公约数 `bundled`;mt-config 另需的 `backup` 由它自己
# `features = ["backup"]` 追加(features 可加不可减)。
#
# ⚠️ 这一行**不影响三个 sidecar 二进制**:它们只依赖 mt-core / mt-ssh
# (见 sidecars/Cargo.toml),不依赖上面三个 crate。红线只有「绝不让 mt-core
# 依赖任何带 rusqlite 的 crate」。
rusqlite = { version = "0.40.1", features = ["bundled"] }

# ---------------------------------------------------------------------------
# 工作区内部
# ---------------------------------------------------------------------------
mt-ai = { path = "crates/mt-ai" }
# mt-app 的非 GPUI 应用域逻辑与服务层(布局树 / 写线程 / 监听 / diff 算法等,不依赖 gpui)。
mt-app-core = { path = "crates/mt-app-core" }
mt-config = { path = "crates/mt-config" }
# tauri-free 的叶子共享库(收尾-1 批自 `src-tauri/mt-core` 移入):WSL UNC 解析 /
# SSH 提示扫描 + ANSI 剥离 / 原子写 / SshConnection。
# ⚠️ 依赖方向铁律:mt-core **只依赖 serde/serde_json/dirs**,绝不反向依赖
# mt-config 等上层 crate —— 它同时被三个 sidecar 二进制(miniterm-hook /
# mt-ssh-mcp / mt-ssh-cli)与 mt-ssh 链接,加一层就把整套上层依赖拖进小二进制。
mt-core = { path = "crates/mt-core" }
# 按需扩展的本机侧(清单解析 / 查找 / 校验安装 / GC / 离线导入,不联网、不依赖 gpui)。
# mt-remote(helper 部署)与 mt-app(扩展服务 + 设置页)依赖它。
mt-extensions = { path = "crates/mt-extensions" }
mt-i18n = { path = "crates/mt-i18n" }
# 界面布局持久化(layout.db)。从 config.json 里搬出来的理由见该 crate 的模块注释:
# 布局是交互频次的数据,不该每改一次就把整份配置连同 .bak 重写一遍。
#
# 它带 rusqlite,但**三个 sidecar 二进制不在影响面内** —— 它们只依赖 mt-core /
# mt-ssh(见 sidecars/Cargo.toml),既不依赖本 crate 也不依赖 mt-config。真正的
# 红线只有一条:绝不让 `mt-core` 依赖任何带 rusqlite 的 crate。
mt-layout = { path = "crates/mt-layout" }
mt-project = { path = "crates/mt-project" }
mt-git-helper = { path = "crates/mt-git-helper" }
mt-pty = { path = "crates/mt-pty" }
mt-relay = { path = "crates/mt-relay" }
# 已存 SSH 密码的封存层(AES-256-GCM 信封 + `credential.key` 主密钥,Windows 走 DPAPI)。
# 位置在 mt-core 之上、mt-config / mt-ssh / mt-app 之下;经 mt-ssh 进入三个 sidecar,
# 所以它自己的依赖表也只许有 ring / base64 / serde / zeroize 这一级(见其 Cargo.toml)。
mt-secret = { path = "crates/mt-secret" }
# 共享 SSH 通信层(russh 持久会话池 + SFTP 原语),收尾-1 批自 `src-tauri/mt-ssh`
# 移入;BB 批(SSH 全套 UI)接线用。
mt-ssh = { path = "crates/mt-ssh" }
mt-terminal = { path = "crates/mt-terminal" }
# 外置主题包的文件层(自 mt-config 拆出)。mt-ui 的主题桥只要其中的 `ThemePacks`,
# 单独成 crate 后 mt-ui 不再经 mt-config 连带依赖 rusqlite、也不随 config.rs 重编。
mt-theme-packs = { path = "crates/mt-theme-packs" }
mt-ui = { path = "crates/mt-ui" }
mt-usage = { path = "crates/mt-usage" }
# SSH 远程项目的服务层(自 mt-app 的 `remote_ssh/` 下沉,不依赖 gpui)。
mt-remote = { path = "crates/mt-remote" }

# dev 构建(含 `cargo test`)的调试信息只留行号表:panic 的 backtrace 照样有函数名与
# file:line(含内联帧),但不再给局部变量 / 类型写完整的调试信息 —— target 目录与
# Windows 上的 PDB 明显变小,链接也快一截。
# 要用调试器看局部变量、单步时,本地临时改回 `debug = true`(或只对这一次构建设
# `CARGO_PROFILE_DEV_DEBUG=true`),别提交。
#
# ⚠️ rust-cache 的键不看根 Cargo.toml 的 profile,改这一段要给 ci 那组 rust-cache 换
# prefix-key 强制换代(见 cache-warm.yml 头部注释)。
[profile.dev]
debug = "line-tables-only"

# GPUI + wgpu/blade 的依赖树很大:dev 下依赖走 opt-level 1 把运行速度提上来,自己的
# crate 保持 0。依赖连行号表也不留(`debug = false`):调试信息的大头在这棵树上,
# 代价是 backtrace 里第三方库的帧没有行号(Windows 上函数名也可能只是就近的公共
# 符号)—— 够判断卡在哪个库;要进依赖里单步时同上,本地临时改回。
[profile.dev.package."*"]
opt-level = 1
debug = false

# 发布构建。只调这四项:前三项是「体积/运行时换构建时间」的保守档位,`debug` 是给
# Windows 崩溃排查留的行号表(不进 exe,见该项注释)。
#
# ⚠️ **不要加 `panic = "abort"`**:进程内多处依赖 unwind 语义 —— PTY reader 线程、
# hook server、后台执行器上的任务 panic 后由 join handle 收敛成错误,单个 pane 挂掉
# 不该带走整个应用;abort 会把这些全变成进程级崩溃。
[profile.release]
# thin LTO:跨 crate 内联的收益拿到八成左右,链接时间与内存占用远低于 `fat`
# (GPUI + wgpu/blade 那棵依赖树用 fat 在 CI 上很容易顶到内存上限)。
lto = "thin"
# 单个 codegen unit:让 LLVM 看到整个 crate 再优化。代价是丢掉 codegen 并行,
# release 构建变慢 —— 但 release 只在发版/CI 跑,不吃开发迭代的时间。
codegen-units = 1
# 调试信息只要行号表,给 Windows 的 PDB 用(panic 的 backtrace 要能落到函数名 + file:line):
# - MSVC:调试信息从来不进 exe,链接器把它写进旁边的 `mini_term.pdb`。rustc 在 MSVC 上
#   **不理会** `strip`(PE 里没有可剥的调试信息)—— 下面 strip = "symbols" 时 PDB 其实一直
#   在生成,只是 debug = 0 时里面只有公共符号:用户代码的帧会被就近安到别的函数名上、
#   没有行号(实测)。开行号表后函数名与 file:line(含内联帧)都对,exe 体积不变。
#   PDB 由 release.yml 作为单独资产发布,不进安装包。
# - macOS / Linux:行号表被下面的 strip 连同符号表一起剥掉,产物大小不变,只多一点编译
#   时间。macOS 开了调试信息时 cargo 默认 split-debuginfo = "unpacked"(调试信息留在 .o 里、
#   不跑 dsymutil);Linux 默认 "off",编进二进制后由 strip 剥掉。
debug = "line-tables-only"
# 剥符号表(macOS / Linux):装机包小一圈。用 `symbols` 而非 `debuginfo` —— 后者只去
# 调试信息,符号表还留着。MSVC 上无效(见上一项)。
strip = "symbols"

# gpui-base / gpui-component / gpui-kit / gpui-kit-assets 0.10.0 开启 `gpui-fast`
# feature 后在各自 `lib.rs` 中用 `extern crate gpui_fast as gpui;` 完全遮蔽了
# `gpui-pre`,但 Cargo.toml 仍将 `gpui-pre =0.3.12` / `gpui-pre-platform =0.3.12`
# 保留为非可选依赖。这里用空壳 stub 替换,只编译唯一一份 `gpui-fast` 引擎,同时
# 彻底省掉 `gpui-pre-{windows,macos,linux}` 三端平台后端。
# Windows 的 PerMonitorV2 / SegmentHeap 清单改由宿主 `crates/mt-app/build.rs` 嵌入
# (`gpui-component 0.10` 已为 `gpui-fast` 开启 `windows-manifest-provided-by-host`)。
# ⚠️ 升级 gpui-component 时若其钉死的 gpui-pre 版本变了,同步改 `patches/*/Cargo.toml` 的 version。
[patch.crates-io]
gpui-pre = { path = "patches/gpui-pre" }
gpui-pre-platform = { path = "patches/gpui-pre-platform" }
