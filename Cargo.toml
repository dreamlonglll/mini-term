# mini-term 主工作区(GPUI 原生应用)
#
# 这个工作区只包含 `crates/`。其余目录各自独立构建:
#   - `sidecars/`:sidecar 二进制工作区(miniterm-hook / mt-ssh-mcp / mt-ssh-cli)。
#     版本号自成语义(daemon 换代靠它判断,不跟随主程序发版),且并入会触发依赖
#     统一重排本工作区的 Cargo.lock,故保持独立。由 scripts/stage-sidecars.mjs
#     构建并就位到主程序 exe 同目录。
#   - `relay-server/`:移动端中转服务(其 protocol crate 被 mt-relay path 依赖,
#     与 sidecars 依赖 crates/mt-core 是同一种跨工作区用法)。
#   - `mobile/`:移动端 PWA(纯前端,无 Rust)。
#
# 历史:旧 Tauri 版(`src-tauri/` + React 前端 `src/`)已随 v1.0.0-beta 后的
# 发版切换整体删除,GPUI 版是唯一形态;找旧实现看 git 历史。
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["sidecars", "relay-server", "mobile"]

[workspace.package]
version = "1.2.2"
edition = "2024"
# 与 src-tauri 保持同一底线(libsqlite3-sys 0.38 的 build.rs 用 cfg_select!)
rust-version = "1.95"
authors = ["mini-term"]
license = "MIT"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# GPUI 栈
# ---------------------------------------------------------------------------
# 全部取自 crates.io，不用 git 依赖 —— 可复现、可锁版本。
#
# ⚠️ 不要换成 `gpui-ce`:gpui-component 依赖的是 Zed 官方 `gpui ^0.2.2`，
#    混用会在依赖树里出现两个不同的 `gpui` crate，类型无法互通。
#    (gpui-ce 的卖点是 wgpu 单一后端，代价是没有任何组件库可用，且
#     crates.io 版本停在 0.3.3 / 2025-12-27。)
#
# ⚠️ Linux 构建需要额外打开 gpui 的 `x11` / `wayland` feature，
#    Windows / macOS 默认 feature 即可。
gpui = "0.2.2"
# 组件库:Resizable(替 Allotment) / Tree(替 FileTree) / TabBar / Modal / Input /
# Table，以及 JSON 驱动的主题层 + 运行时主题注册表(替自研 theme_packs 的一部分)。
gpui-component = "0.5.1"

# ---------------------------------------------------------------------------
# 终端
# ---------------------------------------------------------------------------
# VT 状态机。取代 xterm.js:字节直接喂进 Term 的 grid，没有 IPC、没有 JSON、
# 没有 Base64、没有前端解析 pass —— 现有的 16ms 批缓冲 / 有界 channel /
# 4MB-1MB 双水位背压 / set_pty_flow_paused / 30s 超时兜底整套随之作废。
alacritty_terminal = "0.26"
portable-pty = "0.8"

# ---------------------------------------------------------------------------
# 通用
# ---------------------------------------------------------------------------
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
dirs = "6"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# 移动端配对二维码(U 批)。default-features=false 砍掉 image 输出后端 ——
# 只要 QrCode 的位矩阵，渲染由 mt-app 自绘(静区 1 模块 / EC level M)。
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
# 跨线程 join_all / oneshot 等组合子(mt-app 的 PTY 唤醒信号、mt-ssh 的池 shutdown)。
# gpui 自己就依赖 futures 0.3,提到工作区只是去重声明,不会多拉一棵依赖树。
futures = "0.3"
# 主题包 manifest 的 sha256 校验(mt-config)。
sha2 = "0.11.0"
# SQLite:config.db(mt-config)/ layout.db(mt-layout)/ usage.db(mt-usage) 三家共用。
#
# ⚠️ **版本必须三家一致**:同一棵依赖树里出现两个 rusqlite 会连带两份
# libsqlite3-sys,构建直接失败 —— 提到工作区正是为了让这条约束由 Cargo 兜住,
# 而不是靠三份注释互相提醒。
#
# features 只放三家的公约数 `bundled`;mt-config 另需的 `backup` 由它自己
# `features = ["backup"]` 追加(features 可加不可减)。
#
# ⚠️ 这一行**不影响三个 sidecar 二进制**:它们只依赖 mt-core / mt-ssh
# (见 sidecars/Cargo.toml),不依赖上面三个 crate。红线只有「绝不让 mt-core
# 依赖任何带 rusqlite 的 crate」。
rusqlite = { version = "0.40.1", features = ["bundled"] }

# ---------------------------------------------------------------------------
# 工作区内部
# ---------------------------------------------------------------------------
mt-ai = { path = "crates/mt-ai" }
mt-config = { path = "crates/mt-config" }
# tauri-free 的叶子共享库(收尾-1 批自 `src-tauri/mt-core` 移入):WSL UNC 解析 /
# SSH 提示扫描 + ANSI 剥离 / 原子写 / SshConnection / 临时私钥落盘。
# ⚠️ 依赖方向铁律:mt-core **只依赖 serde/serde_json/dirs**,绝不反向依赖
# mt-config 等上层 crate —— 它同时被三个 sidecar 二进制(miniterm-hook /
# mt-ssh-mcp / mt-ssh-cli)与 mt-ssh 链接,加一层就把整套上层依赖拖进小二进制。
mt-core = { path = "crates/mt-core" }
mt-i18n = { path = "crates/mt-i18n" }
# 界面布局持久化(layout.db)。从 config.json 里搬出来的理由见该 crate 的模块注释:
# 布局是交互频次的数据,不该每改一次就把整份配置连同 .bak 重写一遍。
#
# 它带 rusqlite,但**三个 sidecar 二进制不在影响面内** —— 它们只依赖 mt-core /
# mt-ssh(见 sidecars/Cargo.toml),既不依赖本 crate 也不依赖 mt-config。真正的
# 红线只有一条:绝不让 `mt-core` 依赖任何带 rusqlite 的 crate。
mt-layout = { path = "crates/mt-layout" }
mt-project = { path = "crates/mt-project" }
mt-pty = { path = "crates/mt-pty" }
mt-relay = { path = "crates/mt-relay" }
# 共享 SSH 通信层(russh 持久会话池 + SFTP 原语),收尾-1 批自 `src-tauri/mt-ssh`
# 移入;BB 批(SSH 全套 UI)接线用。
mt-ssh = { path = "crates/mt-ssh" }
mt-terminal = { path = "crates/mt-terminal" }
mt-ui = { path = "crates/mt-ui" }
mt-usage = { path = "crates/mt-usage" }

# 迁移期把编译时间压下来:GPUI + wgpu/blade 的依赖树很大，
# dev 下依赖走 opt-level 1，自己的 crate 保持 0 以留调试信息。
[profile.dev.package."*"]
opt-level = 1

# 发布构建。只调这三项,都是「体积/运行时换构建时间」的保守档位。
#
# ⚠️ **不要加 `panic = "abort"`**:进程内多处依赖 unwind 语义 —— PTY reader 线程、
# hook server、后台执行器上的任务 panic 后由 join handle 收敛成错误,单个 pane 挂掉
# 不该带走整个应用;abort 会把这些全变成进程级崩溃。
[profile.release]
# thin LTO:跨 crate 内联的收益拿到八成左右,链接时间与内存占用远低于 `fat`
# (GPUI + wgpu/blade 那棵依赖树用 fat 在 CI 上很容易顶到内存上限)。
lto = "thin"
# 单个 codegen unit:让 LLVM 看到整个 crate 再优化。代价是丢掉 codegen 并行,
# release 构建变慢 —— 但 release 只在发版/CI 跑,不吃开发迭代的时间。
codegen-units = 1
# 剥符号表:装机包小一圈,且发布产物不需要本地符号(崩溃分析靠日志与复现步骤)。
# 用 `symbols` 而非 `debuginfo` —— 后者只去调试信息,符号表还留着。
strip = "symbols"
