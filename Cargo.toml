# mini-term 主工作区(GPUI 原生应用)
#
# 这个工作区只包含 `crates/`。其余目录各自独立构建:
#   - `sidecars/`:sidecar 二进制工作区(miniterm-hook / mt-ssh-mcp / mt-ssh-cli)。
#     版本号自成语义(daemon 换代靠它判断,不跟随主程序发版),且并入会触发依赖
#     统一重排本工作区的 Cargo.lock,故保持独立。由 scripts/stage-sidecars.mjs
#     构建并就位到主程序 exe 同目录。
#   - `relay-server/`:移动端中转服务(其 protocol crate 被 mt-relay path 依赖,
#     与 sidecars 依赖 crates/mt-core 是同一种跨工作区用法)。
#   - `mobile/`:移动端 PWA(纯前端,无 Rust)。
#
# 历史:旧 Tauri 版(`src-tauri/` + React 前端 `src/`)已随 v1.0.0-beta 后的
# 发版切换整体删除,GPUI 版是唯一形态;找旧实现看 git 历史。
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["sidecars", "relay-server", "mobile"]

[workspace.package]
version = "1.13.9"
edition = "2024"
# 与 src-tauri 保持同一底线(libsqlite3-sys 0.38 的 build.rs 用 cfg_select!)
rust-version = "1.95"
authors = ["mini-term"]
license = "MIT"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# GPUI 栈
# ---------------------------------------------------------------------------
# 全部取自 crates.io，不用 git 依赖 —— 可复现、可锁版本。
#
# ⚠️ 不要换成 `gpui-ce`:gpui-component 0.6 依赖的是 `gpui-pre`(下面那份 Zed 快照,
#    与本仓 `gpui` 别名指向的是同一个包),混用会在依赖树里出现两个不同的 gpui
#    crate，类型无法互通。
#    (gpui-ce 的卖点是 wgpu 单一后端，代价是没有任何组件库可用，且
#     crates.io 版本停在 0.3.3 / 2025-12-27。)
#
# ⚠️ Linux 构建需要额外打开 gpui_platform 的 `x11` / `wayland` feature
#    (见 mt-app 的 target 依赖段),Windows / macOS 默认 feature 即可。
# spike/gpui-pre:底座换成 huacnlee 上传的 Zed 快照 gpui-pre(zed@d89e9c2,2026-09-14)。
# 0.3.x 把窗口/文字后端拆去了 gpui_platform,应用入口改为 gpui_platform::application()。
gpui = { package = "gpui-pre", version = "0.3.5" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.5" }
# 组件库:Resizable(替 Allotment) / Tree(替 FileTree) / TabBar / Modal / Input /
# Table，以及 JSON 驱动的主题层 + 运行时主题注册表(替自研 theme_packs 的一部分)。
gpui-component = "0.6.2"
# 组件库的图标资产(`AssetSource`)。0.6.2 把图标本体从 gpui-component 拆进了这个
# crate,**它本来就在依赖树里**(gpui-component 的直接依赖),这里只是把传递依赖
# 提成直接依赖好在 `main.rs` 挂上 —— 版本必须与 gpui-component 拉的那份**完全一致**,
# 否则依赖树里会出现两份、`IconName` 的路径对不上。
# `Assets` = 组件库默认用到的 101 枚 Lucide 线条图(约 44 KB);全集 `AllAssets`
# 是 1830 枚(约 731 KB),本仓用不上。没有它时上游组件画 `IconName::*` 一律是
# **空白且编译期无感**(svg 走 AssetSource 取,取不到只记一行日志)。
gpui-kit-assets = "0.6.2"
# 本地 HTML 预览的系统 WebView(Windows = WebView2,macOS = WKWebView)。gpui-component
# 0.6 起把 `webview` feature 拆成了这个独立 crate(gpui-kit 出品,同一份 gpui-pre)。
# ⚠️ 钉死 =0.6.4:0.6.5 起它把 gpui-pre 钉成 `=0.3.6`,与上面的 0.3.5 冲突(两版源码
#    一字不差,底座升 0.3.6 时再一起放开)。只挂在 mt-app 的 Windows / macOS 段 ——
#    wry 在 Linux 上要 webkit2gtk 系统库,CI 的 Linux 构建机没有。
gpui-wry = "=0.6.4"
# gpui-wry 用的 wry 分支(longbridge 维护)。建 WebView 要直接用它的 builder,
# 版本与 gpui-wry 拉的那份一致,依赖树里只有一份。
wry = { package = "lb-wry", version = "0.53.3" }

# ---------------------------------------------------------------------------
# 终端
# ---------------------------------------------------------------------------
# VT 状态机。取代 xterm.js:字节直接喂进 Term 的 grid，没有 IPC、没有 JSON、
# 没有 Base64、没有前端解析 pass —— 现有的 16ms 批缓冲 / 有界 channel /
# 4MB-1MB 双水位背压 / set_pty_flow_paused / 30s 超时兜底整套随之作废。
alacritty_terminal = "0.26"
portable-pty = "0.8"
# 列宽判定。alacritty_terminal 自己就靠它(逐字符定宽),mt-terminal 用同一份表算
# emoji 字位簇的**整簇**宽度(`mt-terminal::width`),版本跟它对齐。
unicode-width = "0.2"
# 字位簇边界(UAX #29):emoji 呈现 / 修饰 / ZWJ 序列、区域指示符成对这些「几个字符
# 落一格」的判定靠它。gpui 依赖树里本来就有,不多拉一棵。
unicode-segmentation = "1"

# ---------------------------------------------------------------------------
# 通用
# ---------------------------------------------------------------------------
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
dirs = "6"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# 移动端配对二维码(U 批)。default-features=false 砍掉 image 输出后端 ——
# 只要 QrCode 的位矩阵，渲染由 mt-app 自绘(静区 1 模块 / EC level M)。
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
# 跨线程 join_all / oneshot 等组合子(mt-app 的 PTY 唤醒信号、mt-ssh 的池 shutdown)。
# gpui 自己就依赖 futures 0.3,提到工作区只是去重声明,不会多拉一棵依赖树。
futures = "0.3"
# 主题包 manifest 的 sha256 校验(mt-theme-packs)。
sha2 = "0.11.0"
# SQLite:config.db(mt-config)/ layout.db(mt-layout)/ usage.db(mt-usage) 三家共用。
#
# ⚠️ **版本必须三家一致**:同一棵依赖树里出现两个 rusqlite 会连带两份
# libsqlite3-sys,构建直接失败 —— 提到工作区正是为了让这条约束由 Cargo 兜住,
# 而不是靠三份注释互相提醒。
#
# features 只放三家的公约数 `bundled`;mt-config 另需的 `backup` 由它自己
# `features = ["backup"]` 追加(features 可加不可减)。
#
# ⚠️ 这一行**不影响三个 sidecar 二进制**:它们只依赖 mt-core / mt-ssh
# (见 sidecars/Cargo.toml),不依赖上面三个 crate。红线只有「绝不让 mt-core
# 依赖任何带 rusqlite 的 crate」。
rusqlite = { version = "0.40.1", features = ["bundled"] }

# ---------------------------------------------------------------------------
# 工作区内部
# ---------------------------------------------------------------------------
mt-ai = { path = "crates/mt-ai" }
mt-config = { path = "crates/mt-config" }
# tauri-free 的叶子共享库(收尾-1 批自 `src-tauri/mt-core` 移入):WSL UNC 解析 /
# SSH 提示扫描 + ANSI 剥离 / 原子写 / SshConnection / 临时私钥落盘。
# ⚠️ 依赖方向铁律:mt-core **只依赖 serde/serde_json/dirs**,绝不反向依赖
# mt-config 等上层 crate —— 它同时被三个 sidecar 二进制(miniterm-hook /
# mt-ssh-mcp / mt-ssh-cli)与 mt-ssh 链接,加一层就把整套上层依赖拖进小二进制。
mt-core = { path = "crates/mt-core" }
mt-i18n = { path = "crates/mt-i18n" }
# 界面布局持久化(layout.db)。从 config.json 里搬出来的理由见该 crate 的模块注释:
# 布局是交互频次的数据,不该每改一次就把整份配置连同 .bak 重写一遍。
#
# 它带 rusqlite,但**三个 sidecar 二进制不在影响面内** —— 它们只依赖 mt-core /
# mt-ssh(见 sidecars/Cargo.toml),既不依赖本 crate 也不依赖 mt-config。真正的
# 红线只有一条:绝不让 `mt-core` 依赖任何带 rusqlite 的 crate。
mt-layout = { path = "crates/mt-layout" }
mt-project = { path = "crates/mt-project" }
mt-pty = { path = "crates/mt-pty" }
mt-relay = { path = "crates/mt-relay" }
# 已存 SSH 密码的封存层(AES-256-GCM 信封 + `credential.key` 主密钥,Windows 走 DPAPI)。
# 位置在 mt-core 之上、mt-config / mt-ssh / mt-app 之下;经 mt-ssh 进入三个 sidecar,
# 所以它自己的依赖表也只许有 ring / base64 / serde / zeroize 这一级(见其 Cargo.toml)。
mt-secret = { path = "crates/mt-secret" }
# 共享 SSH 通信层(russh 持久会话池 + SFTP 原语),收尾-1 批自 `src-tauri/mt-ssh`
# 移入;BB 批(SSH 全套 UI)接线用。
mt-ssh = { path = "crates/mt-ssh" }
mt-terminal = { path = "crates/mt-terminal" }
# 外置主题包的文件层(自 mt-config 拆出)。mt-ui 的主题桥只要其中的 `ThemePacks`,
# 单独成 crate 后 mt-ui 不再经 mt-config 连带依赖 rusqlite、也不随 config.rs 重编。
mt-theme-packs = { path = "crates/mt-theme-packs" }
mt-ui = { path = "crates/mt-ui" }
mt-usage = { path = "crates/mt-usage" }
# SSH 远程项目的服务层(自 mt-app 的 `remote_ssh/` 下沉,不依赖 gpui)。
mt-remote = { path = "crates/mt-remote" }

# 迁移期把编译时间压下来:GPUI + wgpu/blade 的依赖树很大，
# dev 下依赖走 opt-level 1，自己的 crate 保持 0 以留调试信息。
[profile.dev.package."*"]
opt-level = 1

# 发布构建。只调这四项:前三项是「体积/运行时换构建时间」的保守档位,`debug` 是给
# Windows 崩溃排查留的行号表(不进 exe,见该项注释)。
#
# ⚠️ **不要加 `panic = "abort"`**:进程内多处依赖 unwind 语义 —— PTY reader 线程、
# hook server、后台执行器上的任务 panic 后由 join handle 收敛成错误,单个 pane 挂掉
# 不该带走整个应用;abort 会把这些全变成进程级崩溃。
[profile.release]
# thin LTO:跨 crate 内联的收益拿到八成左右,链接时间与内存占用远低于 `fat`
# (GPUI + wgpu/blade 那棵依赖树用 fat 在 CI 上很容易顶到内存上限)。
lto = "thin"
# 单个 codegen unit:让 LLVM 看到整个 crate 再优化。代价是丢掉 codegen 并行,
# release 构建变慢 —— 但 release 只在发版/CI 跑,不吃开发迭代的时间。
codegen-units = 1
# 调试信息只要行号表,给 Windows 的 PDB 用(panic 的 backtrace 要能落到函数名 + file:line):
# - MSVC:调试信息从来不进 exe,链接器把它写进旁边的 `mini_term.pdb`。rustc 在 MSVC 上
#   **不理会** `strip`(PE 里没有可剥的调试信息)—— 下面 strip = "symbols" 时 PDB 其实一直
#   在生成,只是 debug = 0 时里面只有公共符号:用户代码的帧会被就近安到别的函数名上、
#   没有行号(实测)。开行号表后函数名与 file:line(含内联帧)都对,exe 体积不变。
#   PDB 由 release.yml 作为单独资产发布,不进安装包。
# - macOS / Linux:行号表被下面的 strip 连同符号表一起剥掉,产物大小不变,只多一点编译
#   时间。macOS 开了调试信息时 cargo 默认 split-debuginfo = "unpacked"(调试信息留在 .o 里、
#   不跑 dsymutil);Linux 默认 "off",编进二进制后由 strip 剥掉。
debug = "line-tables-only"
# 剥符号表(macOS / Linux):装机包小一圈。用 `symbols` 而非 `debuginfo` —— 后者只去
# 调试信息,符号表还留着。MSVC 上无效(见上一项)。
strip = "symbols"
