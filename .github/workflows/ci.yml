name: CI

# 什么时候跑:
# - 推 `v*` tag(发版):与 release.yml 并行,对账范围是上一个 `v*` tag 到本 tag 的
#   全部变更(见下方 diff-base 的 tag 分支)。日常往分支 push **不跑** —— 本仓单人
#   直推 main 为主,每次 push 都跑一遍两平台的全量 check + test 不值。
# - pull_request:分支保护 `main-ci-gate` 要求 `Rust workspace` 这个 check 过了才能
#   合(外部 PR 走这条),砍掉它 PR 会永远卡在 "waiting for status"。
# - workflow_dispatch:想在某个分支上手动跑一次时用。
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 原先由 dtolnay/rust-toolchain 顺手设上的;改成 rustup 按文件装之后在这里显式给
  # (CARGO_INCREMENTAL=0 由 rust-cache 设,不必重复)
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # persist-credentials: false:不把 token 写进 .git/config(cargo check/test 期间
      # 依赖的 build.rs 都读得到那个文件)。下面的 git 操作全是本地的,不再 fetch
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # 基线的算法(PR / 发版 tag / 分支 / 手动)见脚本注释,Windows 作业共用同一份
      - name: Resolve changed-file base
        id: diff-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/resolve_diff_base.sh

      # Keep this list aligned with the Linux build job in release.yml. GPUI's
      # X11/Wayland backend and font/audio dependencies are required even for
      # check/test because mt-app is part of the workspace.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libasound2-dev

      # npm 缓存给下面的移动端构建用,键只看 mobile/package-lock.json;main 上由
      # cache-warm.yml 预先建好,这里精确命中就不会再往 tag / PR 作用域存一份
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # 工具链(含 rustfmt / clippy 两个组件)按仓库根的 rust-toolchain.toml 装,与本地同版本,
      # 不再用 dtolnay/rust-toolchain@stable —— 本地 clippy 比 CI 旧、发版后才报红的根因就在这。
      # 无参 `rustup toolchain install` = 装当前生效的工具链(rustup ≥ 1.28)
      - name: Setup Rust (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc -vV
          cargo clippy -V
          rustfmt -V

      # 缓存只读:由 cache-warm.yml 在 main 上建(tag / PR 的运行都能恢复 main 作用域的
      # 缓存,反过来不行;main 推送又不跑本 workflow,所以缓存只能靠那边预热)。
      # 这里不再保存 —— 此前每个 tag 各存一份约 6.6 GB,tag 之间互相看不见、从没命中过,
      # 两个 tag 就把仓库 10 GB 额度顶满。
      # ⚠️ prefix-key / shared-key / workspaces 三项与 cache-warm.yml 的 ci-linux 作业逐字一致,键才对得上;
      # 改一边必须改另一边。workspaces 的 target 是**相对 workspace 根**的路径
      # (rust-cache 按 path.join(root, target) 解析),`sidecars -> sidecars/target`
      # 会落到 sidecars/sidecars/target,sidecar 缓存从来没生效过。
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          shared-key: ci
          save-if: false
          workspaces: |
            . -> target
            sidecars -> target
            relay-server -> target

      # The repository has historical rustfmt differences, including inside
      # files that new work may need to touch. Run rustfmt on changed files but
      # fail only when its diff intersects lines changed by this branch.
      - name: Check changed Rust formatting
        shell: bash
        run: |
          node .github/scripts/check_changed_rustfmt.mjs \
            "${{ steps.diff-base.outputs.sha }}"

      - name: Check generated i18n dictionary
        run: |
          node crates/mt-i18n/tools/gen_from_ts.mjs
          git diff --exit-code -- crates/mt-i18n/src/dict.rs

      - name: Cargo check
        run: cargo check --locked --workspace --all-targets

      - name: Sidecar check
        run: cargo check --locked --manifest-path sidecars/Cargo.toml --all-targets

      # 全工作区 clippy,只拦**本次变更行**上的 warning(基线存量不算,见
      # check_changed_clippy.mjs)。deny 级 lint 是 error,clippy 自己就非零退出,
      # 不经过滤直接判红 —— 所以基线里不许有 deny 级问题。
      - name: Clippy workspace (changed lines)
        shell: bash
        run: |
          base="${{ steps.diff-base.outputs.sha }}"
          set +e
          cargo clippy --locked --no-deps --workspace --all-targets --message-format=json \
            | tee /tmp/clippy-messages.jsonl
          clippy_status=${PIPESTATUS[0]}
          set -e
          if [ "$clippy_status" -ne 0 ]; then
            exit "$clippy_status"
          fi
          node .github/scripts/check_changed_clippy.mjs \
            "$base" /tmp/clippy-messages.jsonl

      - name: Cargo test
        run: cargo test --locked --workspace

      - name: Sidecar test
        run: cargo test --locked --manifest-path sidecars/Cargo.toml

      # 线上部署的中转服务(协议边界、鉴权、fail-closed),此前 CI 连编译都没有
      - name: Relay server test
        run: cargo test --locked --manifest-path relay-server/Cargo.toml

      # tests/*.test.cjs:便携 ConPTY 包的 staging 脚本 + 依赖图里 OpenSSL 必须 vendored
      # (后者跑 `cargo tree --target aarch64-apple-darwin`,只解析依赖图,不需要装该 target)
      - name: Node script tests
        shell: bash
        run: node --test tests/*.test.cjs

      # 移动端 PWA:tsc 类型检查 + vite 构建。协议类型是手写镜像(mobile/src/protocol.ts),
      # 与 relay-server/protocol 对不上时往往先在这里的 tsc 报出来
      - name: Mobile build
        working-directory: mobile
        run: |
          npm ci
          npm run build

      - name: Whitespace check
        run: git diff --check "${{ steps.diff-base.outputs.sha }}" HEAD

  # 主力平台的编译门。clipboard / tray / frost / notify / dpapi / conpty / logfile
  # 这些 cfg(windows) 模块在 ubuntu 作业里根本不进编译,此前只有发版时才第一次
  # 编到它们。这里做 check + clippy(同样只拦变更行,覆盖 cfg(windows) 代码)+ 全部
  # 不拖 gpui 的 crate 的测试 + sidecar 测试;rustfmt / i18n 对账与平台无关,不重复。
  windows:
    name: Windows check
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      # fetch-depth: 0:clippy 变更行过滤要拿完整历史算基线
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve changed-file base
        id: diff-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/resolve_diff_base.sh

      # 变更行过滤与 crate 名单两个脚本要 node;镜像自带的版本不钉,这里钉成与 Linux 同一个
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # 同上:按 rust-toolchain.toml 装,不另写版本
      - name: Setup Rust (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc -vV

      # 只读缓存,理由同 Linux 作业;prefix-key / shared-key / workspaces 与 cache-warm.yml 的
      # ci-windows 作业逐字一致
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          shared-key: ci
          save-if: false
          workspaces: |
            . -> target
            sidecars -> target

      - name: Cargo check
        run: cargo check --locked --workspace --all-targets

      - name: Sidecar check
        run: cargo check --locked --manifest-path sidecars/Cargo.toml --all-targets

      - name: Clippy workspace (changed lines)
        shell: bash
        run: |
          base="${{ steps.diff-base.outputs.sha }}"
          messages="$RUNNER_TEMP/clippy-messages.jsonl"
          set +e
          cargo clippy --locked --no-deps --workspace --all-targets --message-format=json \
            | tee "$messages"
          clippy_status=${PIPESTATUS[0]}
          set -e
          if [ "$clippy_status" -ne 0 ]; then
            exit "$clippy_status"
          fi
          node .github/scripts/check_changed_clippy.mjs "$base" "$messages"

      # 真机才验得到的路径:ConPTY 起真进程、DPAPI 包裹主密钥、WSL UNC 解析、
      # mt-project 的 Windows 路径用例等。名单 = 工作区里全部不依赖 gpui 的 crate,
      # 由脚本从 cargo metadata 现算(2026-09 时是 mt-ai mt-config mt-core mt-i18n
      # mt-layout mt-project mt-pty mt-relay mt-remote mt-secret mt-ssh mt-terminal
      # mt-theme-packs mt-usage,
      # 只剩 mt-app / mt-ui 两个拖 gpui 的不在这里跑)。PTY → VT → grid 的冒烟
      # (mt-terminal/tests/terminal_smoke.rs,起 powershell)也随 mt-terminal 在这里跑。
      - name: Cargo test (crates without gpui)
        shell: bash
        run: |
          pkgs="$(node .github/scripts/non_gpui_packages.mjs)"
          cargo test --locked $pkgs

      # 命名管道 ACL(仅当前用户可连)等 sidecar 的 Windows 专属用例
      - name: Sidecar test
        run: cargo test --locked --manifest-path sidecars/Cargo.toml
