name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve changed-file base
        id: diff-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          elif [ "$EVENT_NAME" = "push" ] && \
               [ -n "$PUSH_BEFORE_SHA" ] && \
               [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            # workflow_dispatch on the default branch has no `before` SHA.
            # Check the selected revision's latest commit instead of treating
            # the entire repository history as new work.
            base="$(git rev-parse HEAD^)"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git cat-file -e "$base^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # Keep this list aligned with the Linux build job in release.yml. GPUI's
      # X11/Wayland backend and font/audio dependencies are required even for
      # check/test because mt-app is part of the workspace.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            sidecars -> sidecars/target

      # The repository has historical rustfmt differences, including inside
      # files that new work may need to touch. Run rustfmt on changed files but
      # fail only when its diff intersects lines changed by this branch.
      - name: Check changed Rust formatting
        shell: bash
        run: |
          node .github/scripts/check_changed_rustfmt.mjs \
            "${{ steps.diff-base.outputs.sha }}"

      - name: Check generated i18n dictionary
        run: |
          node crates/mt-i18n/tools/gen_from_ts.mjs
          git diff --exit-code -- crates/mt-i18n/src/dict.rs

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Sidecar check
        run: cargo check --manifest-path sidecars/Cargo.toml --all-targets

      - name: Clippy affected packages
        shell: bash
        run: |
          base="${{ steps.diff-base.outputs.sha }}"
          set +e
          cargo clippy --no-deps \
            -p mt-project -p mt-ssh -p mt-config -p mt-app \
            --all-targets --message-format=json \
            | tee /tmp/clippy-messages.jsonl
          clippy_status=${PIPESTATUS[0]}
          set -e
          if [ "$clippy_status" -ne 0 ]; then
            exit "$clippy_status"
          fi
          node .github/scripts/check_changed_clippy.mjs \
            "$base" /tmp/clippy-messages.jsonl

      - name: Cargo test
        run: cargo test --workspace

      - name: Whitespace check
        run: git diff --check "${{ steps.diff-base.outputs.sha }}" HEAD

  # 主力平台的编译门。clipboard / tray / frost / notify / dpapi / conpty / logfile
  # 这些 cfg(windows) 模块在 ubuntu 作业里根本不进编译,此前只有发版时才第一次
  # 编到它们。这里只做 check + 几个不拖 gpui 的 crate 的测试,不重复 rustfmt /
  # clippy / i18n 对账(那些与平台无关,上面的作业已经管了)。
  windows:
    name: Windows check
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            sidecars -> sidecars/target

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Sidecar check
        run: cargo check --manifest-path sidecars/Cargo.toml --all-targets

      # 真机才验得到的路径:ConPTY 起真进程、DPAPI 包裹主密钥、WSL UNC 解析。
      # 这几个 crate 都不依赖 gpui,测试二进制几分钟内能编出来。
      - name: Cargo test (Windows-specific crates)
        run: cargo test -p mt-pty -p mt-secret -p mt-core -p mt-terminal
