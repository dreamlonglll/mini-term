name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt-artifact:
    name: Rustfmt artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Formatting is produced on the GitHub runner so the development machine
      # never runs a Rust tool. The artifact is applied in the next commit, then
      # this temporary job is removed.
      - name: Format changed Rust files
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.rs')
          rustfmt --edition 2024 "${files[@]}"
          printf '%s\0' "${files[@]}" \
            | tar --null --files-from=- -czf rustfmt-output.tar.gz

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-${{ github.sha }}
          path: rustfmt-output.tar.gz
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Keep this list aligned with the Linux build job in release.yml. GPUI's
      # X11/Wayland backend and font/audio dependencies are required even for
      # check/test because mt-app is part of the workspace.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            sidecars -> sidecars/target

      # The repository has historical rustfmt differences. Check only Rust
      # files changed by this branch so CI does not conflate them with this work.
      - name: Check changed Rust formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          elif [ -n "$PUSH_BEFORE_SHA" ] && \
               [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.rs')
          if [ "${#files[@]}" -gt 0 ]; then
            rustfmt --edition 2024 --check "${files[@]}"
          fi

      - name: Check generated i18n dictionary
        run: |
          node crates/mt-i18n/tools/gen_from_ts.mjs
          git diff --exit-code -- crates/mt-i18n/src/dict.rs

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Sidecar check
        run: cargo check --manifest-path sidecars/Cargo.toml --all-targets

      - name: Clippy affected packages
        run: cargo clippy -p mt-project -p mt-ssh -p mt-config -p mt-app --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Whitespace check
        run: git diff --check
