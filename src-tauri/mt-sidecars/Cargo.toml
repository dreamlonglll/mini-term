[package]
name = "mt-sidecars"
version = "0.4.8"
description = "mini-term sidecar binaries: miniterm-hook (AI hook) and mt-ssh-mcp (SSH MCP server)"
edition = "2021"

# 独立 crate：不依赖 tauri / tauri-build，单独 cargo build 不会触发主程序的
# externalBin 校验。两个 sidecar 由 scripts/stage-sidecars.mjs 构建并就位。

[[bin]]
name = "miniterm-hook"
path = "src/bin/miniterm-hook.rs"

[[bin]]
name = "mt-ssh-mcp"
path = "src/bin/mt-ssh-mcp.rs"

[dependencies]
mt-core = { path = "../mt-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# portable-pty 仅 miniterm-hook 仍在使用；mt-ssh-mcp 重构到 russh 后不再依赖。
portable-pty = "0.8"
# mt-ssh-mcp 的 MCP server 实现：官方 rmcp stdio server。
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time", "sync"] }
# mt-ssh-mcp 的 SSH 客户端实现：纯 Rust + tokio 原生 async；
# 持久会话池由它建/维持单条 SSH 连接，channel 用于 exec。
#
# 加密后端用 ring 而非默认 aws-lc-rs：后者在 Windows MSVC 上需要 NASM 汇编器
# (aws-lc-sys 的 jitterentropy / chacha20 等用 NASM 写优化路径)，本仓库与 CI
# 都没装 NASM；ring 是 pure Rust 不需要任何额外工具链。
russh = { version = "0.61", default-features = false, features = ["ring"] }
# 会话池 shutdown 时并发关闭多条 session 用 join_all。
futures = "0.3"
# known_hosts 文件读写时编解码 server pubkey 字节。
base64 = "0.22"
# --- 传统 PKCS#1 RSA 私钥支持 (task 06-06-ssh-mcp-pkcs1-rsa-key) ---
# russh::keys 底层 ssh-key 默认只解析 OpenSSH / PKCS#8; 传统 `-----BEGIN RSA PRIVATE
# KEY-----`(PKCS#1) 会报 "Unsupported key type RSA" 导致连接失败。启用 ssh-key 的
# `rsa` feature, 在 pool.rs 做纯 Rust fallback: PKCS#1 PEM -> rsa::RsaPrivateKey ->
# ssh_key::private::RsaKeypair -> ssh_key::PrivateKey, 再交给 russh 认证。
# 版本精确锁 =0.7.0-rc.10 与 russh 0.61 内部锁定一致, 否则 PrivateKey 跨 crate 版本
# 类型不可互换(同 rand_core 多版本陷阱)。
ssh-key = { version = "=0.7.0-rc.10", default-features = false, features = ["rsa", "alloc"] }
# 解析 PKCS#1 RSA。版本须与 ssh-key 0.7.0-rc.10 内部锁定的 rsa 一致(=0.10.0-rc.18),
# 否则 RsaKeypair::try_from(&rsa::RsaPrivateKey) 因类型来自不同 crate 版本而编译失败。
# 用默认 features(std + encoding, 后者含 pkcs1 DER 解码); rsa 没有 `pem` feature
# (PEM 仅由 pkcs1/pem 提供且 rsa 未传递), 故走 from_pkcs1_der + 自剥 PEM(base64)路径。
# 纯 Rust(num-bigint/crypto-bigint), 不触发 aws-lc 的 NASM 工具链依赖; rand_core 统一 0.10。
rsa = "=0.10.0-rc.18"

[dev-dependencies]
# 单测里的 SSH 公钥用预计算 OpenSSH 字符串解析,无需 rand 依赖。

