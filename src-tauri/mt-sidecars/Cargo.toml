[package]
name = "mt-sidecars"
version = "0.4.8"
description = "mini-term sidecar binaries: miniterm-hook (AI hook) and mt-ssh-mcp (SSH MCP server)"
edition = "2021"

# 独立 crate：不依赖 tauri / tauri-build，单独 cargo build 不会触发主程序的
# externalBin 校验。两个 sidecar 由 scripts/stage-sidecars.mjs 构建并就位。

[[bin]]
name = "miniterm-hook"
path = "src/bin/miniterm-hook.rs"

[[bin]]
name = "mt-ssh-mcp"
path = "src/bin/mt-ssh-mcp.rs"

[dependencies]
mt-core = { path = "../mt-core" }
# SSH 持久会话池 + SFTP 传输原语(russh 0.61 + ring 后端、ssh-key/rsa 精确锁、
# russh-sftp)。task 07-05-ssh-remote-projects PR1 抽到共享 crate mt-ssh,
# 主程序与 sidecar 共用;russh 类型(如 ChannelMsg)经 `mt_ssh::russh` 再导出取用,
# 保证与池同一 crate 版本。依赖版本锁的完整说明见 ../mt-ssh/Cargo.toml。
mt-ssh = { path = "../mt-ssh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# portable-pty 仅 miniterm-hook 仍在使用；mt-ssh-mcp 重构到 russh 后不再依赖。
portable-pty = "0.8"
# mt-ssh-mcp 的 MCP server 实现：官方 rmcp stdio server。
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
# SFTP 传输的 tokio::fs 本地文件读写已随会话池迁入 mt-ssh(其 `fs`/`io-util`
# features 经 feature unification 依旧生效);这里只保留 sidecar 自身需要的面。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "sync"] }

