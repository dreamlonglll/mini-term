[package]
name = "tauri-app"
version = "0.6.5"
description = "mini-term: AI-aware desktop terminal manager built on Tauri v2 — multi-project, multi-tab, split-pane, IM bridged via cc-connect"
authors = ["you"]
edition = "2021"
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mt-core = { path = "mt-core" }
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
notify = "7"
ignore = "0.4"
regex = "1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-window-state = "2"
dirs = "6"
git2 = "0.19"
pathdiff = "0.2"
tiny_http = "0.12"
toml_edit = "0.22"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
] }
# WSL 发行版枚举:读 HKCU\...\Lxss 注册表,不 spawn wsl.exe(避免 UTF-16 stdout 坑)。
# 0.2 与 windows 0.58 共享 windows-result 0.2 / windows-targets 0.52 依赖树。
windows-registry = "0.2"
image = "0.25"
