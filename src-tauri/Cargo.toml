[package]
name = "tauri-app"
version = "0.8.3"
description = "mini-term: AI-aware desktop terminal manager built on Tauri v2 — multi-project, multi-tab, split-pane"
authors = ["you"]
edition = "2021"
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mt-core = { path = "mt-core" }
# 共享 SSH 通信层(russh 持久会话池 + SFTP 原语,task 07-05 PR1 抽出)。
# 主程序用它实现「SSH 远程项目」的远程文件树 / 远程目录验证 / 远程 AI 会话扫描;
# 与 mt-ssh-mcp sidecar 各持一个池实例。russh 用 ring 后端,不触发 aws-lc 的
# NASM 工具链依赖(见 spec/backend/rust-crypto-on-windows-msvc.md)。
mt-ssh = { path = "mt-ssh" }
# 远程 SSH 能力需要的 tokio 面:time(外层超时)、io-util(SFTP 流读扩展 trait)。
# 运行时本身由 Tauri v2 的 async runtime(tokio)提供,这里只声明直接用到的 feature。
tokio = { version = "1", features = ["time", "io-util", "sync", "macros", "rt"] }
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
notify = "7"
ignore = "0.4"
regex = "1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-window-state = "2"
dirs = "6"
git2 = "0.19"
pathdiff = "0.2"
tiny_http = "0.12"
toml_edit = "0.22"
# 移动端中转体系:桌面端 ↔ 中转服务器共享的协议消息类型(docs/adr/0001)
mt-relay-protocol = { path = "../relay-server/protocol" }
# 桌面端对中转的出站 WSS 长连。rustls 显式关默认 feature 并选 ring 后端,
# 避免 aws-lc-rs 在 Windows MSVC 上的 NASM 工具链依赖
# (见 spec/backend/rust-crypto-on-windows-msvc.md);运行时需 install ring provider。
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
] }
# WSL 发行版枚举:读 HKCU\...\Lxss 注册表,不 spawn wsl.exe(避免 UTF-16 stdout 坑)。
# 0.2 与 windows 0.58 共享 windows-result 0.2 / windows-targets 0.52 依赖树。
windows-registry = "0.2"
image = "0.25"
