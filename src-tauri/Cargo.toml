[package]
name = "tauri-app"
version = "0.4.8"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "miniterm-hook"
path = "src/bin/miniterm-hook.rs"

[[bin]]
name = "mt-ssh-mcp"
path = "src/bin/mt-ssh-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mt-core = { path = "mt-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
notify = "7"
ignore = "0.4"
regex = "1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-window-state = "2"
dirs = "6"
git2 = "0.19"
pathdiff = "0.2"
tiny_http = "0.12"
toml_edit = "0.22"
# SSH MCP sidecar (mt-ssh-mcp bin) 依赖:官方 rmcp stdio MCP server。
# feature 仅 server + macros + transport-io(服务端 stdio),不开 HTTP/auth。
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
] }
image = "0.25"
